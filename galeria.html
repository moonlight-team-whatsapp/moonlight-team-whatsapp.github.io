<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Galería MoonCard · Moonlight Team</title>
<meta name="description" content="Galería de MoonCards del equipo de Moonlight Team: mira las tarjetas de los personajes y úsalas como plantilla.">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,500;0,600;1,500&family=Crimson+Pro:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
<style>
  .wrap{ max-width:1200px; }
  .tagbar{ display:flex; flex-wrap:wrap; gap:6px; margin:-6px 0 16px }
  .tagbar button,.gtags span{ padding:3px 10px; border-radius:999px; border:1px solid rgba(217,195,131,.45); background:rgba(217,195,131,.07); color:var(--gold,#d9c383); font:inherit; font-size:.88rem; cursor:pointer }
  .tagbar button.on{ background:rgba(217,195,131,.3); color:#fff }
  .gtin{ padding:6px 10px; font:inherit; font-size:.9rem; color:var(--ink); background:rgba(255,255,255,.05); border:1px solid var(--border); border-radius:8px; min-width:0; width:100% }
  #edDlg[open]{ display:flex; flex-direction:column; gap:6px }
  #edDlg h3{ margin:0 0 8px } #edDlg label{ margin-top:8px } #edDlg .fila{ margin-top:14px }
  .gtags{ display:flex; flex-wrap:wrap; gap:4px } .gtags span{ cursor:default; padding:1px 8px; font-size:.8rem }
  .filters{ display:flex; gap:8px; flex-wrap:wrap; margin:6px 0 16px; align-items:center; }
  .filters select{ padding:8px 10px; font-family:'Crimson Pro',serif; font-size:1rem; color:var(--ink); background:rgba(255,255,255,.05); border:1px solid var(--border); border-radius:4px; min-width:200px; }
  .grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:16px; }
  .gc{ border:1px solid var(--border); border-radius:10px; background:rgba(16,22,48,.7); overflow:hidden; display:flex; flex-direction:column; animation:gin .5s both; animation-delay:calc(var(--i,0) * 50ms); transition:transform .2s, border-color .2s, box-shadow .2s; }
  .gc:hover{ transform:translateY(-3px); border-color:var(--gold-dim); box-shadow:0 10px 26px rgba(0,0,0,.4); }
  .gc img{ display:block; width:100%; aspect-ratio:1000/620; object-fit:cover; background:#0e1326; cursor:zoom-in; }
  .gc .meta{ padding:10px 12px; display:flex; flex-direction:column; gap:8px; }
  .gc b{ font-family:'Cormorant',serif; font-style:italic; font-size:1.25rem; color:var(--gold); }
  .gc small{ color:var(--ink-soft); }
  .gc .row{ display:flex; gap:8px; flex-wrap:wrap; }
  .gc.pend{ border-style:dashed; }
  select option{ background:#141b37; color:#eef0fb; }
  .gsel{ padding:6px 8px; font-family:'Crimson Pro',serif; color:var(--ink); background:#141b37; border:1px solid var(--border); border-radius:4px; max-width:100%; }
  .gbtn{ padding:6px 12px; border-radius:999px; font-family:'Cormorant',serif; font-style:italic; font-weight:600; font-size:1rem; cursor:pointer; color:var(--gold); border:1px solid rgba(217,195,131,.5); background:rgba(217,195,131,.08); text-decoration:none; transition:background .2s, transform .15s; }
  .gbtn:hover{ background:rgba(217,195,131,.22); transform:translateY(-1px); }
  .gbtn.red{ color:#ff9b9b; border-color:rgba(255,155,155,.5); background:rgba(255,155,155,.06); }
  h2.sec{ font-family:'Cormorant',serif; font-style:italic; color:var(--gold); margin:22px 0 10px; }
  #zoomDlg{ background:none; border:none; padding:0; max-width:94vw; } #zoomDlg::backdrop{ background:rgba(0,0,0,.8); } #zoomDlg img{ max-width:94vw; max-height:90vh; border-radius:12px; display:block; }
  @keyframes gin{ from{ opacity:0; transform:translateY(10px); } to{ opacity:1; transform:none; } }
  @media (prefers-reduced-motion:reduce){ .gc{ animation:none; transition:none; } }
</style>
<script src="js/temporadas.js"></script>
</head>
<body>
<div class="stars" id="starsLayer" aria-hidden="true"></div>
<div class="mist m1" aria-hidden="true"></div>
<div class="mist m2" aria-hidden="true"></div>
<div class="moon" aria-hidden="true"></div>
<div class="wrap">
  <a class="back-link" href="index.html">← Volver al índice</a>
  <header class="top">
    <div>
      <div class="title-wrap"><h1>Galería MoonCard</h1></div>
      <p class="subtitle">Las tarjetas del equipo. Pulsa «Usar como plantilla» para abrir cualquiera en el editor y hacerla tuya. <a href="mooncard.html" style="color:var(--gold)">Crear mi MoonCard</a></p>
    </div>
    <button class="admin-toggle" id="adminToggleBtn">Acceso admin</button>
  </header>
  <div id="pendBox" hidden><h2 class="sec">Pendientes de aprobar</h2><div class="grid" id="pendGrid"></div><h2 class="sec">Publicadas</h2></div>
  <div class="filters"><select id="fPer" aria-label="Filtrar por personaje"><option value="">Todos los personajes</option></select><span id="count" class="subtitle"></span></div>
  <div class="tagbar" id="tagBar"></div>
  <div class="grid" id="grid"></div>
  <p class="empty-note" id="empty" hidden>Todavía no hay tarjetas en la galería.</p>
</div>
<dialog id="loginDialog">
  <div class="dialog-inner">
    <h3>Acceso admin</h3>
    <div class="dialog-field"><label for="loginEmail">Email</label><input id="loginEmail" type="email" autocomplete="username"></div>
    <div class="dialog-field"><label for="loginPass">Contraseña</label><input id="loginPass" type="password" autocomplete="current-password"></div>
    <p class="dialog-error" id="loginError"></p>
    <div class="dialog-actions">
      <button class="btn-primary" id="loginSubmit" type="button">Entrar</button>
      <button class="btn-ghost" id="loginCancel" type="button">Cancelar</button>
    </div>
  </div>
</dialog>

<dialog id="edDlg" style="max-width:min(440px,92vw);padding:22px 24px" class="eddlg"><h3 id="edTit">Editar tarjeta</h3>
  <label for="edPer">Personaje</label><select id="edPer" class="gsel"></select>
  <label for="edTags">Etiquetas (hasta 5)</label><input id="edTags" class="gtin" maxlength="90" placeholder="#navidad #verano">
  <p id="edMsg" class="subtitle" role="status"></p>
  <div class="fila" style="display:flex;gap:8px;flex-wrap:wrap"><button class="gbtn" id="edSave" type="button">Guardar</button><button class="gbtn" id="edMain" type="button">★ Hacer principal</button><button class="gbtn suave" id="edNo" type="button">Cerrar</button></div>
</dialog>
<dialog id="zoomDlg"><img id="zoomImg" alt=""></dialog>
<script type="module">
import { sb } from './js/supabase-sesion.js';
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
(function(){ const l = $('starsLayer'), fr = document.createDocumentFragment(); for (let i = 0; i < 36; i++){ const s = document.createElement('span'); s.className = 'star'; const z = (Math.random()*1.6+.8).toFixed(2); s.style.cssText = `top:${Math.random()*100}%;left:${Math.random()*100}%;width:${z}px;height:${z}px`; s.style.setProperty('--dur', (Math.random()*3+2).toFixed(2)+'s'); s.style.setProperty('--delay', (Math.random()*5).toFixed(2)+'s'); s.style.setProperty('--o-min', '.2'); s.style.setProperty('--o-max', '.85'); fr.appendChild(s); } l.appendChild(fr); })();
let isAdmin = false, rows = [], names = [], tagSel = null;
const url = p => sb.storage.from('mooncards').getPublicUrl(p).data.publicUrl;
async function load(){
  const { data } = await sb.from('mooncards').select('*').order('creada', { ascending: false });
  rows = data || []; paint();
  const o = await sb.from('ocupados').select('data'); names = [...new Set((o.data || []).map(x => x.data && x.data.nombre).filter(Boolean))].sort((a, b) => a.localeCompare(b)); if (isAdmin) paint();
}
function card(r, pend){
  const d = new Date(r.creada).toLocaleDateString('es-ES');
  return `<article class="gc${pend ? ' pend' : ''}" style="--i:IDX"><img src="${url(r.img_path)}" alt="${esc(r.titulo || 'MoonCard de ' + r.personaje)}" loading="lazy" data-zoom="${esc(url(r.img_path))}"><div class="meta"><b>${esc(r.titulo || r.personaje)}</b>${(r.etiquetas || []).length ? `<div class="gtags">${r.etiquetas.map(e => `<span>#${esc(e)}</span>`).join('')}</div>` : ''}<small>${r.principal ? '★ Principal · ' : ''}${r.titulo ? esc(r.personaje) + ' · ' : ''}${d}</small><div class="row"><a class="gbtn" href="mooncard.html?plantilla=${r.id}">Usar como plantilla</a>${isAdmin ? (pend ? `<button class="gbtn" data-ok="${r.id}" type="button">Aprobar</button>` : '') + `<button class="gbtn" data-edit="${r.id}" type="button">✏️ Editar</button><button class="gbtn red" data-del="${r.id}" type="button">Borrar</button>` : ''}</div></div></article>`;
}
function paint(){
  const ap = rows.filter(r => r.aprobada), pe = rows.filter(r => !r.aprobada);
  const keys = [...new Map(ap.map(r => [r.personaje_key, r.personaje])).entries()].sort((a, b) => a[1].localeCompare(b[1]));
  const sel = $('fPer'), cur = sel.value;
  sel.innerHTML = '<option value="">Todos los personajes</option>' + keys.map(([k, n]) => `<option value="${esc(k)}">${esc(n)}</option>`).join(''); sel.value = keys.some(k => k[0] === cur) ? cur : '';
  const cnt = {}; ap.forEach(r => (r.etiquetas || []).forEach(e => cnt[e] = (cnt[e] || 0) + 1));
  if (tagSel && !cnt[tagSel]) tagSel = null;
  $('tagBar').innerHTML = Object.keys(cnt).sort((a, b) => cnt[b] - cnt[a] || a.localeCompare(b)).map(e => `<button type="button" data-tag="${esc(e)}" class="${e === tagSel ? 'on' : ''}">#${esc(e)} <small>${cnt[e]}</small></button>`).join('');
  const list = ap.filter(r => (!sel.value || r.personaje_key === sel.value) && (!tagSel || (r.etiquetas || []).includes(tagSel)));
  $('grid').innerHTML = list.map((r, i) => card(r, false).replace('IDX', i)).join('');
  $('empty').hidden = !!ap.length; $('count').textContent = ap.length ? list.length + ' tarjeta' + (list.length === 1 ? '' : 's') : '';
  $('pendBox').hidden = !(isAdmin && pe.length);
  $('pendGrid').innerHTML = pe.map((r, i) => card(r, true).replace('IDX', i)).join('');
}
$('fPer').onchange = paint;
$('tagBar').onclick = e => { const b = e.target.closest('[data-tag]'); if (!b) return; tagSel = tagSel === b.dataset.tag ? null : b.dataset.tag; paint(); };
function normTags(s){ const seen = {}, out = [];
  String(s || '').toLowerCase().replace(/ñ/g, '\u0001').normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/\u0001/g, 'ñ').split(/[\s,;#]+/).forEach(x => { x = x.replace(/[^a-z0-9ñ_]/g, ''); if (x.length >= 2 && !seen[x]){ seen[x] = 1; out.push(x.slice(0, 24)); } });
  return out.slice(0, 5); }
let edId = null;
function abrirEd(r){ edId = r.id; $('edMsg').textContent = '';
  const nm = names.includes(r.personaje) ? names : [r.personaje, ...names];
  $('edPer').innerHTML = nm.map(n => `<option${n === r.personaje ? ' selected' : ''}>${esc(n)}</option>`).join('');
  $('edTags').value = (r.etiquetas || []).map(e => '#' + e).join(' ');
  $('edMain').hidden = !r.aprobada || r.principal; $('edDlg').showModal(); }
$('edNo').onclick = () => $('edDlg').close();
$('edSave').onclick = async () => {
  const r = rows.find(x => x.id === edId); if (!r) return; $('edSave').disabled = true;
  let err = (await sb.from('mooncards').update({ etiquetas: normTags($('edTags').value) }).eq('id', r.id)).error;
  if (!err && $('edPer').value !== r.personaje) err = (await sb.from('mooncards').update({ personaje: $('edPer').value }).eq('id', r.id)).error;
  $('edSave').disabled = false;
  if (err){ $('edMsg').textContent = /limite/.test(err.message) ? 'Ese personaje ya tiene 5 tarjetas.' : 'No se pudo guardar.'; return; }
  $('edDlg').close(); load(); };
$('edMain').onclick = async () => { const r = rows.find(x => x.id === edId); if (!r) return; $('edMain').disabled = true;
  await sb.from('mooncards').update({ principal: false }).eq('personaje_key', r.personaje_key); await sb.from('mooncards').update({ principal: true }).eq('id', r.id);
  $('edMain').disabled = false; $('edDlg').close(); load(); };

document.addEventListener('click', async e => {
  const z = e.target.closest('[data-zoom]'); if (z){ $('zoomImg').src = z.dataset.zoom; $('zoomDlg').showModal(); return; }
  if (e.target === $('zoomDlg') || e.target === $('zoomImg')) $('zoomDlg').close();
  const ed = e.target.closest('[data-edit]'); if (ed){ const r = rows.find(x => x.id === ed.dataset.edit); if (r) abrirEd(r); return; }
  const mn = e.target.closest('[data-main]');
  if (mn){ mn.disabled = true; const r = rows.find(x => x.id === mn.dataset.main); await sb.from('mooncards').update({ principal: false }).eq('personaje_key', r.personaje_key); await sb.from('mooncards').update({ principal: true }).eq('id', r.id); load(); return; }
  const ok = e.target.closest('[data-ok]'), del = e.target.closest('[data-del]');
  if (ok){ ok.disabled = true; const r = rows.find(x => x.id === ok.dataset.ok);
    if (r && (r.etiquetas || []).includes('main')){ await sb.from('mooncards').update({ principal: false }).eq('personaje_key', r.personaje_key); await sb.from('mooncards').update({ aprobada: true, principal: true }).eq('id', r.id); }
    else await sb.from('mooncards').update({ aprobada: true }).eq('id', ok.dataset.ok);
    load(); }
  if (del){
    if (del.dataset.arm !== '1'){ del.dataset.arm = '1'; del.textContent = '¿Seguro? Pulsa otra vez'; setTimeout(() => { del.dataset.arm = ''; del.textContent = 'Borrar'; }, 3500); return; }
    const r = rows.find(x => x.id === del.dataset.del); del.disabled = true;
    await sb.from('mooncards').delete().eq('id', r.id); await sb.storage.from('mooncards').remove([r.img_path, r.diseno_path]); load();
  }
});
$('adminToggleBtn').addEventListener('click', () => {
  if (isAdmin) sb.auth.signOut();
  else { $('loginError').textContent = ''; $('loginEmail').value = ''; $('loginPass').value = ''; $('loginDialog').showModal(); }
});
$('loginCancel').addEventListener('click', () => $('loginDialog').close());
$('loginSubmit').addEventListener('click', async () => {
  const { error } = await sb.auth.signInWithPassword({ email: $('loginEmail').value.trim(), password: $('loginPass').value });
  if (error) $('loginError').textContent = 'Email o contraseña incorrectos.'; else $('loginDialog').close();
});
sb.auth.onAuthStateChange((_e, session) => {
  isAdmin = !!session; $('adminToggleBtn').textContent = isAdmin ? 'Cerrar sesión admin' : 'Acceso admin'; load();
});
load();
</script>
</body>
</html>
