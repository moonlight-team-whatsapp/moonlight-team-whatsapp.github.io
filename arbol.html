<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCJw3MuQQrYZ7xaabbKhK5Q4fAAB5xzZsk",
    authDomain: "moonlight-teamm-947ee.firebaseapp.com",

    appId: "1:664050217208:web:194120b9ab73b43a984b0d"
  };
  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const auth = getAuth(app);
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const normalize = (s) => String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').trim().toLowerCase();

  // ---------- Estrellas ----------
  (function paintStars(){
    const layer = $('starsLayer');
    const count = window.innerWidth < 480 ? 26 : 42;
    const frag = document.createDocumentFragment();
    for (let i = 0; i < count; i++){
      const s = document.createElement('span');
      s.className = 'star';
      const size = (Math.random() * 1.6 + 0.8).toFixed(2);
      s.style.top = (Math.random() * 100).toFixed(2) + '%';
      s.style.left = (Math.random() * 100).toFixed(2) + '%';
      s.style.width = size + 'px';
      s.style.height = size + 'px';
      s.style.setProperty('--dur', (Math.random() * 3 + 2).toFixed(2) + 's');
      s.style.setProperty('--delay', (Math.random() * 5).toFixed(2) + 's');
      s.style.setProperty('--o-min', (Math.random() * 0.2 + 0.15).toFixed(2));
      s.style.setProperty('--o-max', (Math.random() * 0.3 + 0.7).toFixed(2));
      frag.appendChild(s);
    }
    layer.appendChild(frag);
  })();

  // ---------- Estado ----------
  let isAdmin = false, sel = null, syncing = false, SC = 1, editing = false, LAY = null, DR = null, SUP = 0;
  let ocupados = [], arbol = [];
  const loaded = { o: false, a: false };
  const ROM = ['I','II','III','IV','V','VI','VII','VIII','IX','X'];

  // <pure>
  function buildPeople(arbolDocs, only){
    const vis = arbolDocs.filter(a => !a.fuera && (!only || only.has(a.id)));
    const ids = new Set(vis.map(a => a.id));
    return vis.map(a => ({
      id: a.id, name: a.nombre || '?', g: a.genero || '',
      parents: (a.padres || []).filter(x => ids.has(x) && x !== a.id),
      partners: (a.parejas || []).filter(x => ids.has(x) && x !== a.id),
      ord: typeof a.orden === 'number' ? a.orden : 1e9,
      fam: a.familia || ''
    }));
  }
  // Familia = la persona, sus parejas y todos sus descendientes (con sus parejas)
  function familyIds(P, id){
    const by = {}; P.forEach(p => by[p.id] = p);
    const set = new Set([id]);
    (by[id].partners || []).forEach(x => set.add(x));
    const q = [...set];
    while (q.length){
      const x = q.pop();
      P.filter(c => c.parents.includes(x)).forEach(c => {
        if (set.has(c.id)) return;
        set.add(c.id); q.push(c.id);
        by[c.id].partners.forEach(pp => set.add(pp));
      });
    }
    return set;
  }
  // Nombre de la familia: el que le hayas puesto (a la persona o a su pareja) o uno automático
  function familiaNombre(P, id){
    const me = P.find(p => p.id === id), ppl = [me, ...me.partners.map(x => P.find(p => p.id === x)).filter(Boolean)];
    return (ppl.find(p => p.fam) || {}).fam || '';
  }
  function familiaTitulo(P, id){
    const nm = familiaNombre(P, id); if (nm) return nm;
    const me = P.find(p => p.id === id), names = [me.name, ...me.partners.map(x => (P.find(p => p.id === x) || {}).name).filter(Boolean)];
    return 'Familia de ' + (names.length > 1 ? names.slice(0, -1).join(', ') + ' y ' + names[names.length - 1] : names[0]);
  }
  function gens(P){
    const g = {}; P.forEach(p => g[p.id] = 0);
    const by = {}; P.forEach(p => by[p.id] = p);
    for (let i = 0; i < 40; i++) P.forEach(p => {
      p.parents.forEach(x => { if (g[p.id] < g[x] + 1) g[p.id] = g[x] + 1; });
      p.partners.forEach(x => { if (g[p.id] < g[x]) g[p.id] = g[x]; });
      if (!p.parents.length){
        const k = P.filter(c => c.parents.includes(p.id));
        if (k.length){ const m = Math.min(...k.map(c => g[c.id])) - 1; if (g[p.id] < m) g[p.id] = m; }
      }
    });
    return g;
  }
  function layout(P, g, max, PX){
    const by = {}; P.forEach(p => by[p.id] = p);
    const rows = [], X = {};
    for (let i = 0; i <= max; i++){
      const ids = P.filter(p => g[p.id] === i).map(p => p.id), seen = new Set(), units = [];
      ids.forEach(id => {
        if (seen.has(id)) return;
        const u = [], st = [id];
        while (st.length){
          const x = st.pop(); if (seen.has(x)) continue;
          seen.add(x); u.push(x);
          by[x].partners.forEach(q => { if (ids.includes(q) && !seen.has(q)) st.push(q); });
        }
        units.push({ ids: u.sort((a, b) => by[a].ord - by[b].ord || ids.indexOf(a) - ids.indexOf(b)), c: 0, d: 0 });
      });
      rows.push(units);
    }
    const avg = a => a.reduce((s, v) => s + v, 0) / a.length;
    const place = us => {
      let prev = null;
      us.forEach(u => {
        const h = u.ids.length * PX / 2, min = prev === null ? -Infinity : prev + h;
        u.c = isFinite(u.c) ? Math.max(u.c, min) : (prev === null ? h : min);
        prev = u.c + h;
        u.ids.forEach((id, k) => X[id] = u.c + (k - (u.ids.length - 1) / 2) * PX);
      });
    };
    rows.forEach(us => {
      us.forEach(u => {
        const d = u.ids.flatMap(id => by[id].parents.filter(p => p in X).map(p => X[p]));
        u.d = d.length ? avg(d) : Infinity;
      });
      const ok = u => Math.min(...u.ids.map(i => by[i].ord));
      us.sort((a, b) => { const x = ok(a), y = ok(b); if (x !== y) return x < y ? -1 : 1; return a.d === b.d ? 0 : a.d < b.d ? -1 : 1; });
      us.forEach(u => u.c = isFinite(u.d) ? u.d : -Infinity);
      place(us);
    });
    for (let i = max - 1; i >= 0; i--){
      rows[i].forEach(u => {
        const d = u.ids.flatMap(id => P.filter(c => c.parents.includes(id)).map(c => X[c.id]));
        if (d.length) u.c = avg(d);
      });
      place(rows[i]);
    }
    return { X, rows };
  }

  // Parentescos automáticos (hijo, nieto, tío abuelo, sobrino nieto, primo…)
  const G = (g, m, f) => g === 'f' ? f : g === 'm' ? m : m + '/' + f.trimStart();
  function label(r, g){
    const { dP, dQ } = r, pick = (arr, i) => arr[i] ? G(g, ...arr[i]) : null;
    if (dQ == 0) return pick([['Hijo','Hija'],['Nieto','Nieta'],['Bisnieto','Bisnieta'],['Tataranieto','Tataranieta']], dP - 1) || 'Descendiente lejano/a';
    if (dP == 0) return pick([['Padre','Madre'],['Abuelo','Abuela'],['Bisabuelo','Bisabuela'],['Tatarabuelo','Tatarabuela']], dQ - 1) || 'Ascendiente lejano/a';
    if (dP == 1 && dQ == 1) return G(g, 'Hermano', 'Hermana');
    if (dP == 1) return G(g, 'Tío', 'Tía') + (dQ < 5 ? ['', G(g, ' abuelo', ' abuela'), G(g, ' bisabuelo', ' bisabuela')][dQ - 2] : ' lejano/a');
    if (dQ == 1) return G(g, 'Sobrino', 'Sobrina') + (dP == 2 ? '' : dP == 3 ? G(g, ' nieto', ' nieta') : G(g, ' bisnieto', ' bisnieta'));
    const k = Math.min(dP, dQ) - 1, d = Math.abs(dP - dQ);
    return G(g, 'Primo', 'Prima') + ' ' + (k == 1 ? G(g, 'hermano', 'hermana') : k + 'º') + (d ? ` (${d} gen. de diferencia)` : '');
  }
  // Parentesco político: padrastro, hijastro, yerno, suegro, cuñado…
  function polLabel(r, g, caso){
    const { dP, dQ } = r, sfx = G(g, ' político', ' política');
    if (caso === 1){
      if (dQ == 0) return dP == 1 ? G(g, 'Hijastro', 'Hijastra') : label(r, g) + sfx;
      if (dP == 0) return dQ == 1 ? G(g, 'Suegro', 'Suegra') : label(r, g) + sfx;
    } else {
      if (dQ == 0) return dP == 1 ? G(g, 'Yerno', 'Nuera') : label(r, g) + sfx;
      if (dP == 0) return dQ == 1 ? G(g, 'Padrastro', 'Madrastra') : label(r, g) + sfx;
    }
    if (dP == 1 && dQ == 1) return G(g, 'Cuñado', 'Cuñada');
    return label(r, g) + sfx;
  }
  function relations(P, id){
    const B = {}; P.forEach(p => B[p.id] = p);
    const by = (i) => B[i];
    const anc = (x) => { const d = { [x]: 0 }; let q = [x]; while (q.length){ const n = []; q.forEach(y => (by(y)?.parents || []).forEach(p => { if (!(p in d)){ d[p] = d[y] + 1; n.push(p); } })); q = n; } return d; };
    const rel = (a, b) => { const A = anc(a), Bn = anc(b); let best = null; for (const c in A) if (c in Bn){ const sm = A[c] + Bn[c]; if (!best || sm < best.s) best = { s: sm, dP: A[c], dQ: Bn[c] }; } return best; };
    // Parentesco por familia reconstituida: b es familia de la pareja de un antepasado de a
    const stepOf = (a, b) => {
      const A = anc(a); let best = null;
      for (const xid in A){
        const dX = A[xid]; if (!dX) continue;
        for (const bid of ((by(xid) || {}).partners || [])){
          if (bid in A) continue;
          const r2 = rel(bid, b); if (!r2) continue;
          const rr = { dP: r2.dP + dX, dQ: r2.dQ, tot: r2.dP + dX + r2.dQ };
          if (!best || rr.tot < best.tot) best = rr;
        }
      }
      return best;
    };
    const relAny = (a, b) => rel(a, b) || stepOf(a, b) || (() => { const r = stepOf(b, a); return r ? { dP: r.dQ, dQ: r.dP } : null; })();
    const me = by(id), out = [];
    P.filter(q => q.id !== id).forEach(q => {
      if (me.partners.includes(q.id) || q.partners.includes(id)){ out.push({ q, t: G(me.g, 'Novio', 'Novia'), k: 0, s: 0 }); return; }
      const r = rel(id, q.id);
      if (r){ out.push({ q, t: label(r, me.g), k: r.dP + r.dQ, s: 1 }); return; }
      let t = null;
      // Familia reconstituida, en ambos sentidos (hijastro/padrastro, hermanastro, sobrino político…)
      {
        const f = stepOf(id, q.id), b = stepOf(q.id, id), inv = b && { dP: b.dQ, dQ: b.dP, tot: b.tot };
        const best = f && (!inv || f.tot <= inv.tot) ? f : inv;
        if (best){
          const rr = { dP: best.dP, dQ: best.dQ };
          if (rr.dQ == 0 && rr.dP == 1) t = G(me.g, 'Hijastro', 'Hijastra');
          else if (rr.dP == 0 && rr.dQ == 1) t = G(me.g, 'Padrastro', 'Madrastra');
          else if (rr.dP == 1 && rr.dQ == 1) t = G(me.g, 'Hermanastro', 'Hermanastra');
          else t = label(rr, me.g) + G(me.g, ' político', ' política');
        }
      }
      // Pareja de un pariente mío (yerno, nuera, suegro, cuñado…), también si el pariente es hijastro/padrastro
      if (!t) for (const sid of me.partners){ const r2 = relAny(sid, q.id); if (r2){ t = polLabel(r2, me.g, 2); break; } }
      if (!t) for (const tid of q.partners){ const r2 = relAny(id, tid); if (r2){ t = polLabel(r2, me.g, 1); break; } }
      if (t) out.push({ q, t, k: 99, s: 2 });
    });
    return out.sort((a, b) => a.s - b.s || a.k - b.k);
  }
  // </pure>

  // ---------- Dibujo ----------
  function computeLayout(mob, only){
    const P = buildPeople(arbol, only);
    if (!P.length) return null;
    const [W, H, PX, RH, LM] = mob ? [108, 48, 126, 100, 62] : [136, 54, 176, 124, 96];

  // ---------- Exportar como imagen (PNG) ----------
  async function drawTreeCanvas(only, title){
    const L = computeLayout(false, only);
    if (!L){ $('statusLine').textContent = 'No hay nada que exportar todavía.'; return null; }
    try { await Promise.all([document.fonts.load("600 16px 'Crimson Pro'"), document.fonts.load("italic 600 44px 'Cormorant'"), document.fonts.load("italic 13px 'Cormorant'")]); } catch (e) {}
    const { P, g, max, X, W, H, RH, sh, wd, ht, RY } = L;
    const pad = 56, head = 120, cw = wd + pad * 2, ch = ht + head + pad;
    // Resolución lo más alta que aguantan los navegadores (también el móvil): ~16 Mpx y 16000 px de lado
    const k = Math.max(0.5, Math.min(3, Math.sqrt(16e6 / (cw * ch)), 16000 / Math.max(cw, ch)));
    const cv = document.createElement('canvas');
    cv.width = Math.round(cw * k); cv.height = Math.round(ch * k);
    const c = cv.getContext('2d');
    c.scale(k, k);
    // fondo
    const bg = c.createLinearGradient(0, 0, 0, ch); bg.addColorStop(0, '#0e1326'); bg.addColorStop(1, '#090c1a');
    c.fillStyle = bg; c.fillRect(0, 0, cw, ch);
    const glow = c.createRadialGradient(cw * .85, 0, 0, cw * .85, 0, Math.max(cw, ch) * .55);
    glow.addColorStop(0, 'rgba(217,195,131,0.18)'); glow.addColorStop(1, 'rgba(217,195,131,0)');
    c.fillStyle = glow; c.fillRect(0, 0, cw, ch);
    // estrellas (siempre las mismas)
    let seed = 20240; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
    for (let i = 0; i < Math.round(cw * ch / 9000); i++){
      c.fillStyle = `rgba(255,255,255,${(0.2 + rnd() * 0.7).toFixed(2)})`;
      c.beginPath(); c.arc(rnd() * cw, rnd() * ch, 0.5 + rnd() * 1.0, 0, 7); c.fill();
    }
    // título
    c.textBaseline = 'alphabetic'; c.textAlign = 'left';
    c.fillStyle = '#eef0fb'; c.font = "italic 600 46px 'Cormorant', serif"; c.fillText(title || 'Árbol de Moonlight', pad, 74);
    c.fillStyle = '#8f8256'; c.font = "italic 18px 'Cormorant', serif"; c.fillText('Moonlight Team', pad + 2, 100);
    c.save(); c.translate(pad, head);
    // generaciones
    for (let i = 0; i <= max; i++){
      const y = RY(i);
      c.setLineDash([2, 5]); c.strokeStyle = 'rgba(197,209,255,0.2)'; c.lineWidth = 1;
      c.beginPath(); c.moveTo(0, y); c.lineTo(wd, y); c.stroke(); c.setLineDash([]);
      c.fillStyle = '#8f8256'; c.font = "italic 14px 'Cormorant', serif"; c.fillText('Gen. ' + (ROM[i] || i + 1), 4, y - 8);
    }
    // aristas
    c.lineWidth = 1.6;
    P.forEach(ch2 => ch2.parents.forEach(a => {
      const x1 = X[a] + sh, y1 = RY(g[a]) + H / 2, x2 = X[ch2.id] + sh, y2 = RY(g[ch2.id]) - H / 2, b = y2 - (RH - H) / 2;
      c.strokeStyle = 'rgba(185,198,239,0.85)'; c.beginPath(); c.moveTo(x1, y1); c.lineTo(x1, b); c.lineTo(x2, b); c.lineTo(x2, y2 - 4); c.stroke();
      c.fillStyle = '#b9c6ef'; c.beginPath(); c.moveTo(x2, y2); c.lineTo(x2 - 5, y2 - 9); c.lineTo(x2 + 5, y2 - 9); c.closePath(); c.fill();
    }));
    P.forEach(p => p.partners.forEach(q => {
      if (p.id < q && g[p.id] === g[q]){
        const l = X[p.id] < X[q] ? p.id : q, r = l === p.id ? q : p.id, y = RY(g[p.id]);
        c.setLineDash([4, 4]); c.strokeStyle = '#8f8256'; c.beginPath(); c.moveTo(X[l] + sh + W / 2, y); c.lineTo(X[r] + sh - W / 2, y); c.stroke(); c.setLineDash([]);
      }
    }));
    // personajes
    P.forEach(p => {
      const x = X[p.id] + sh - W / 2, y = RY(g[p.id]) - H / 2, r = H / 2;
      c.save(); c.shadowColor = 'rgba(185,198,239,0.25)'; c.shadowBlur = 16;
      c.fillStyle = 'rgba(16,22,48,0.96)'; c.beginPath();
      c.moveTo(x + r, y); c.lineTo(x + W - r, y); c.arc(x + W - r, y + r, r, -Math.PI / 2, Math.PI / 2);
      c.lineTo(x + r, y + H); c.arc(x + r, y + r, r, Math.PI / 2, Math.PI * 1.5); c.closePath(); c.fill(); c.restore();
      c.strokeStyle = '#b9c6ef'; c.lineWidth = 1.5; c.stroke();
      c.textAlign = 'center';
      let name = p.name; c.font = "600 16px 'Crimson Pro', serif";
      while (name.length > 1 && c.measureText(name).width > W - 26) name = name.slice(0, -1);
      if (name !== p.name) name = name.trimEnd() + '…';
      c.fillStyle = '#eef0fb'; c.fillText(name, x + W / 2, y + H / 2 - 1);
      c.fillStyle = '#a3adce'; c.font = "italic 13px 'Cormorant', serif";
      c.fillText('Gen. ' + (ROM[g[p.id]] || g[p.id] + 1) + (p.g === 'f' ? ' ♀' : p.g === 'm' ? ' ♂' : ''), x + W / 2, y + H / 2 + 15);
      c.textAlign = 'left';
    });
    c.restore();
    return cv;
  }

  // PDF de una sola página (la imagen en alta resolución dentro): WhatsApp lo manda como documento, sin comprimirlo
  async function exportPdf(only, title, base){
    const cv = await drawTreeCanvas(only, title); if (!cv) return;
    const jb = await toBlob(cv, 'image/jpeg', 0.95);
    if (!jb){ $('statusLine').textContent = 'No se pudo generar el PDF.'; return; }
    const jpg = new Uint8Array(await jb.arrayBuffer());
    const w = cv.width, h = cv.height, pw = +(w * 0.3).toFixed(1), ph = +(h * 0.3).toFixed(1);
    const enc = new TextEncoder(), parts = [], offs = [];
    let len = 0;
    const add = (x) => { const b = typeof x === 'string' ? enc.encode(x) : x; parts.push(b); len += b.length; };
    add('%PDF-1.4\n');
    const obj = (n, head, stream) => {
      offs[n] = len;
      add(`${n} 0 obj\n${head}\n`);
      if (stream){ add('stream\n'); add(stream); add('\nendstream\n'); }
      add('endobj\n');
    };
    const content = enc.encode(`q ${pw} 0 0 ${ph} 0 0 cm /Im0 Do Q`);
    obj(1, '<< /Type /Catalog /Pages 2 0 R >>');
    obj(2, '<< /Type /Pages /Kids [3 0 R] /Count 1 >>');
    obj(3, `<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${pw} ${ph}] /Resources << /XObject << /Im0 4 0 R >> >> /Contents 5 0 R >>`);
    obj(4, `<< /Type /XObject /Subtype /Image /Width ${w} /Height ${h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${jpg.length} >>`, jpg);
    obj(5, `<< /Length ${content.length} >>`, content);
    const xref = len;
    add('xref\n0 6\n0000000000 65535 f \n');
    for (let n = 1; n <= 5; n++) add(String(offs[n]).padStart(10, '0') + ' 00000 n \n');
    add(`trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`);
    descargar(new Blob(parts, { type: 'application/pdf' }), (base || 'arbol-moonlight') + '.pdf');
  }

        const own = owners[o.id] || '';
        const a = arbol.find(x => x.oid === o.id && !vivos.has(x.id))
          || arbol.find(x => normalize(x.nombre) === normalize(o.nombre) && !vivos.has(x.id));
        if (!a){
          batch.set(doc(collection(db, 'arbol')), { nombre: o.nombre, oid: o.id, dueno: own, genero: '', padres: [], parejas: [], fuera: false, orden: i, createdAt: serverTimestamp() });
          n++; return;
        }
        const ref = doc(db, 'arbol', a.id);
        if (a.oid === o.id && !a.fuera){
          vivos.add(a.id);
          const upd = {};
          if (own && a.dueno !== own) upd.dueno = own;
          if (a.nombre !== o.nombre) upd.nombre = o.nombre;
          if (Object.keys(upd).length){ batch.update(ref, upd); n++; }
          return;
        }
        // Personaje que vuelve a estar ocupado: ¿la misma persona?
        if (!own) return;                       // aún sin contacto vinculado: se espera
        vivos.add(a.id);
        if (a.dueno && a.dueno === own){
          batch.update(ref, { fuera: false, oid: o.id, nombre: o.nombre }); n++;
        } else {
          batch.update(ref, { fuera: false, oid: o.id, nombre: o.nombre, dueno: own, genero: '', padres: [], parejas: [] }); n++;
          arbol.forEach(x => {
            if (x.id === a.id) return;
            if ((x.padres || []).includes(a.id)) { batch.update(doc(db, 'arbol', x.id), { padres: arrayRemove(a.id) }); n++; }
            if ((x.parejas || []).includes(a.id)) { batch.update(doc(db, 'arbol', x.id), { parejas: arrayRemove(a.id) }); n++; }
          });
        }
      });
      if (lista.length) arbol.forEach(a => {
        if (!vivos.has(a.id) && !a.fuera && !lista.some(o => o.id === a.oid)){
          batch.update(doc(db, 'arbol', a.id), { fuera: true }); n++;
        }
      });
      if (n) await batch.commit();
      syncing = false;
      if (n) maybeSync();
    } catch (e) {
      syncing = false;
      $('statusLine').textContent = 'No se pudo sincronizar con la lista de ocupados.';
    }
  }

  onSnapshot(collection(db, 'ocupados'), (snap) => {
    ocupados = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    loaded.o = true; maybeSync();
  });
  onSnapshot(collection(db, 'arbol'), (snap) => {
    arbol = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    loaded.a = true; maybeSync(); render();
  }, () => { $('statusLine').textContent = 'No se pudo cargar el árbol.'; });

  // ---------- Login admin ----------
  $('adminToggleBtn').addEventListener('click', () => {
    if (isAdmin) { signOut(auth); return; }
    $('loginError').textContent = ''; $('loginEmail').value = ''; $('loginPass').value = '';
    $('loginDialog').showModal();
  });
  $('loginCancel').addEventListener('click', () => $('loginDialog').close());
  $('loginSubmit').addEventListener('click', async () => {
    $('loginError').textContent = '';
    try { await signInWithEmailAndPassword(auth, $('loginEmail').value.trim(), $('loginPass').value); $('loginDialog').close(); }
    catch (e) { $('loginError').textContent = 'Email o contraseña incorrectos.'; }
  });
  onAuthStateChanged(auth, (user) => {
    isAdmin = !!user;
    $('adminToggleBtn').textContent = isAdmin ? 'Salir del modo admin' : 'Acceso admin';
    $('adminToggleBtn').classList.toggle('is-admin', isAdmin);
    maybeSync(); render();
  });
</script>
</body>
</html>
