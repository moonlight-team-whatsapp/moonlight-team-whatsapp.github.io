<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ruleta · Moonlight Team</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,500;0,600;1,500&family=Crimson+Pro:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
<style>
  .wrap{ max-width:900px; }
  .rl{ display:grid; grid-template-columns:minmax(0,1fr) minmax(0,340px); gap:24px; align-items:start; margin-top:10px; }
  @media(max-width:720px){ .rl{ grid-template-columns:1fr; } }
  .rueda{ position:relative; width:100%; max-width:460px; margin:0 auto; aspect-ratio:1; }
  .rueda canvas{ width:100%; height:100%; display:block; filter:drop-shadow(0 0 22px rgba(217,195,131,.25)); }
  .flecha{ position:absolute; top:-6px; left:50%; width:0; height:0; transform:translateX(-50%); border-left:14px solid transparent; border-right:14px solid transparent; border-top:30px solid var(--gold); filter:drop-shadow(0 2px 4px rgba(0,0,0,.6)); z-index:2; }
  .centro{ position:absolute; top:50%; left:50%; width:22%; height:22%; transform:translate(-50%,-50%); border-radius:50%; border:2px solid var(--gold); background:radial-gradient(circle at 35% 30%,#2a3566,#0f1530); color:var(--gold); font-family:'Cormorant',serif; font-style:italic; font-weight:600; font-size:clamp(.9rem,3.4vw,1.25rem); cursor:pointer; z-index:2; }
  .centro:disabled{ opacity:.6; cursor:default; }
  .panel2{ display:grid; gap:10px; }
  .panel2 textarea{ width:100%; min-height:200px; box-sizing:border-box; padding:10px; font:inherit; color:var(--ink); background:#141b37; border:1px solid var(--border); border-radius:8px; resize:vertical; }
  .panel2 label{ display:flex; gap:8px; align-items:center; justify-content:flex-start; color:var(--ink-soft); } .panel2 label input{ width:auto; flex:none; margin:0; }
  .fila2{ display:flex; gap:8px; flex-wrap:wrap; }
  .gbtn{ padding:6px 14px; border-radius:999px; font-family:'Cormorant',serif; font-style:italic; font-weight:600; font-size:1rem; cursor:pointer; color:var(--gold); border:1px solid rgba(217,195,131,.5); background:rgba(217,195,131,.08); }
  .gbtn:hover{ background:rgba(217,195,131,.22); } .gbtn:disabled{ opacity:.5; cursor:default; }
  .ganador{ min-height:2.4em; text-align:center; font-family:'Cormorant',serif; font-size:clamp(1.5rem,5vw,2.1rem); color:var(--gold); margin:14px 0 4px; }
  .hist{ margin:0; padding-left:2.6em; color:var(--ink-soft); max-height:160px; overflow:auto; }
  .cnt2{ color:var(--ink-soft); font-size:.9rem; }
</style>
<script src="js/temporadas.js"></script>
</head><body>
<div class="stars" id="starsLayer" aria-hidden="true"></div>
<div class="mist m1" aria-hidden="true"></div>
<div class="mist m2" aria-hidden="true"></div>
<div class="moon" aria-hidden="true"></div>
<div class="wrap">
  <a class="back-link" href="index.html">← Volver al índice</a>
  <header class="top"><div><div class="title-wrap"><h1>Ruleta</h1></div><p class="subtitle">Escribe las opciones que quieras (una por línea) y gira. Se guardan en este navegador.</p></div></header>
  <div class="rl">
    <div>
      <div class="rueda"><div class="flecha"></div><canvas id="cv" width="920" height="920" aria-label="Ruleta"></canvas><button class="centro" id="gira" type="button">Girar</button></div>
      <div class="ganador" id="gan" role="status" aria-live="polite"></div>
    </div>
    <div class="panel2">
      <textarea id="ops" placeholder="Una opción por línea&#10;Ayaka&#10;Kazuha&#10;Venti" aria-label="Opciones"></textarea>
      <div class="cnt2" id="cnt"></div>
      <label><input type="checkbox" id="quita"> Quitar de la ruleta a quien salga</label>
      <div class="fila2"><button class="gbtn" id="mezcla" type="button">Mezclar</button><button class="gbtn" id="vacia" type="button">Vaciar</button><button class="gbtn" id="ejemplo" type="button">Ejemplo</button></div>
      <div><b style="color:var(--gold)">Han salido</b> <button class="gbtn" id="limpiaH" type="button" style="padding:1px 10px;font-size:.85rem">Borrar</button><ol class="hist" id="hist"></ol></div>
    </div>
  </div>
</div>
<script>
(function(){
  var $ = function(i){ return document.getElementById(i); };
  var l = $('starsLayer'), fr = document.createDocumentFragment(); for (var i = 0; i < 30; i++){ var s = document.createElement('span'); s.className = 'star'; var z = (Math.random() * 1.6 + .8).toFixed(2); s.style.cssText = 'top:' + (Math.random() * 100).toFixed(2) + '%;left:' + (Math.random() * 100).toFixed(2) + '%;width:' + z + 'px;height:' + z + 'px'; s.style.setProperty('--dur', (Math.random() * 3 + 2).toFixed(2) + 's'); s.style.setProperty('--delay', (Math.random() * 5).toFixed(2) + 's'); s.style.setProperty('--o-min', '.2'); s.style.setProperty('--o-max', '.9'); fr.appendChild(s); } l.appendChild(fr);
  var COL = ['#3b4a8f', '#7a4f9e', '#b8903a', '#2f7d7a', '#a64b6b', '#4f7fc4', '#8b6b2f', '#5a3f86'], MAX = 60;
  var cv = $('cv'), g = cv.getContext('2d'), W = cv.width, ang = 0, girando = false, hist = [];
  function guarda(){ try { localStorage.setItem('mc_ruleta', JSON.stringify({ o: $('ops').value, q: $('quita').checked, h: hist })); } catch (e) {} }
  function carga(){ try { var d = JSON.parse(localStorage.getItem('mc_ruleta') || 'null'); if (d){ $('ops').value = d.o || ''; $('quita').checked = !!d.q; hist = d.h || []; } } catch (e) {} }
  function opciones(){ return $('ops').value.split('\n').map(function(x){ return x.trim(); }).filter(Boolean).slice(0, MAX); }
  function dibuja(){
    var O = opciones(), n = O.length, c = W / 2, r = c - 8; g.clearRect(0, 0, W, W);
    if (!n){ g.fillStyle = '#141b37'; g.beginPath(); g.arc(c, c, r, 0, 7); g.fill(); g.strokeStyle = '#d9c383'; g.lineWidth = 6; g.stroke(); g.fillStyle = '#99a'; g.font = '40px Cormorant, serif'; g.textAlign = 'center'; g.fillText('Añade opciones →', c, c + 90); return; }
    var a = 2 * Math.PI / n;
    for (var i = 0; i < n; i++){
      var a0 = ang + i * a - Math.PI / 2; g.beginPath(); g.moveTo(c, c); g.arc(c, c, r, a0, a0 + a); g.closePath(); g.fillStyle = COL[i % COL.length]; if (n > 1 && n % COL.length === 1 && i === n - 1) g.fillStyle = '#6b6b8f'; g.fill(); g.strokeStyle = 'rgba(255,255,255,.35)'; g.lineWidth = 2; g.stroke();
      g.save(); g.translate(c, c); g.rotate(a0 + a / 2); g.textAlign = 'right'; g.textBaseline = 'middle'; g.fillStyle = '#fff';
      var fs = Math.min(44, Math.max(14, 2 * Math.PI * r / n * .5)), t = O[i]; g.font = '600 ' + fs + 'px Cormorant, Georgia, serif';
      var maxw = r * .72; while (g.measureText(t).width > maxw && fs > 11){ fs -= 2; g.font = '600 ' + fs + 'px Cormorant, Georgia, serif'; }
      if (g.measureText(t).width > maxw){ while (t.length > 3 && g.measureText(t + '…').width > maxw) t = t.slice(0, -1); t += '…'; }
      g.fillText(t, r - 22, 0); g.restore();
    }
    g.beginPath(); g.arc(c, c, r, 0, 7); g.strokeStyle = '#d9c383'; g.lineWidth = 8; g.stroke();
  }
  function pinta(){ var n = opciones().length; $('cnt').textContent = n + (n === 1 ? ' opción' : ' opciones') + (n >= MAX ? ' (máximo)' : ''); $('gira').disabled = girando || n < 2; $('hist').innerHTML = hist.map(function(x){ return '<li></li>'; }).join(''); [].forEach.call($('hist').children, function(li, i){ li.textContent = hist[i]; }); $('hist').scrollTop = $('hist').scrollHeight; dibuja(); }
  function gira(){
    var O = opciones(), n = O.length; if (girando || n < 2) return; girando = true; $('gan').textContent = ''; $('gira').disabled = true;
    var a = 2 * Math.PI / n, gana = Math.floor(Math.random() * n);
    // El puntero está arriba; el centro del sector «gana» debe quedar bajo él, con algo de azar dentro del sector
    var destino = -(gana + .15 + Math.random() * .7) * a, vueltas = (5 + Math.floor(Math.random() * 3)) * 2 * Math.PI, ini = ang % (2 * Math.PI), fin = destino - vueltas;
    var dur = 4800 + Math.random() * 1200, t0 = performance.now(), ease = function(x){ return 1 - Math.pow(1 - x, 4); };
    (function paso(ts){ var x = Math.min(1, (ts - t0) / dur); ang = ini + (fin - ini) * ease(x); dibuja();
      if (x < 1) return requestAnimationFrame(paso);
      girando = false; var ganador = O[gana]; $('gan').textContent = '✨ ' + ganador + ' ✨'; hist.push(ganador); hist = hist.slice(-50);
      if ($('quita').checked){ var L = $('ops').value.split('\n'), k = -1, vis = 0; for (var j = 0; j < L.length; j++){ if (L[j].trim()){ if (vis === gana){ k = j; break; } vis++; } } if (k >= 0){ L.splice(k, 1); $('ops').value = L.join('\n'); } }
      guarda(); pinta(); })(t0);
  }
  $('gira').onclick = gira; cv.onclick = gira;
  $('ops').addEventListener('input', function(){ if (!girando){ guarda(); pinta(); } });
  $('quita').onchange = guarda;
  $('mezcla').onclick = function(){ if (girando) return; var O = opciones(); for (var i = O.length - 1; i > 0; i--){ var j = Math.floor(Math.random() * (i + 1)), t = O[i]; O[i] = O[j]; O[j] = t; } $('ops').value = O.join('\n'); guarda(); pinta(); };
  $('vacia').onclick = function(){ if (girando) return; $('ops').value = ''; $('gan').textContent = ''; guarda(); pinta(); };
  $('ejemplo').onclick = function(){ if (girando) return; $('ops').value = 'Ayaka\nKazuha\nVenti\nZhongli\nXiao\nNahida'; guarda(); pinta(); };
  $('limpiaH').onclick = function(){ hist = []; guarda(); pinta(); };
  carga(); pinta();
})();
</script>
</body>
</html>
