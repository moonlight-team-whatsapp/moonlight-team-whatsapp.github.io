<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ruleta · Moonlight Team</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Crimson+Pro:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
<style>
  .wrap{ max-width:980px; }
  .rl{ display:grid; grid-template-columns:minmax(0,1fr) minmax(0,350px); gap:28px; align-items:start; margin-top:14px; }
  @media(max-width:760px){ .rl{ grid-template-columns:1fr; } }

  /* ——— Rueda ——— */
  .stage{ position:relative; width:100%; max-width:500px; margin:0 auto; }
  .rueda{ position:relative; width:100%; aspect-ratio:1; }
  .rueda::before{ content:''; position:absolute; inset:-8%; border-radius:50%; background:radial-gradient(circle,rgba(217,195,131,.22),rgba(217,195,131,0) 62%); pointer-events:none; animation:resp 4.5s ease-in-out infinite; }
  @keyframes resp{ 50%{ transform:scale(1.05); opacity:.75; } }
  .rueda canvas{ position:relative; width:100%; height:100%; display:block; cursor:pointer; filter:drop-shadow(0 10px 26px rgba(0,0,0,.55)); }
  .flecha{ position:absolute; top:-3.2%; left:50%; width:12%; transform:translateX(-50%); transform-origin:50% 22%; z-index:3; pointer-events:none; filter:drop-shadow(0 3px 5px rgba(0,0,0,.6)); }
  .flecha svg{ width:100%; display:block; }
  .centro{ position:absolute; top:50%; left:50%; width:21%; height:21%; transform:translate(-50%,-50%); border-radius:50%; z-index:2; cursor:pointer; border:3px solid #e9d79a;
    background:radial-gradient(circle at 34% 28%,#fff6cf 0,#e9d79a 18%,#9a7a2e 55%,#3b2d12 100%); color:#2a1f08; font-family:'Cormorant',serif; font-weight:700; font-size:clamp(1rem,3.6vw,1.5rem);
    box-shadow:0 0 0 5px rgba(20,27,55,.9),0 0 22px rgba(217,195,131,.55),inset 0 -6px 12px rgba(0,0,0,.35); text-shadow:0 1px 0 rgba(255,255,255,.4); transition:transform .15s,box-shadow .2s; }
  .centro:hover:not(:disabled){ transform:translate(-50%,-50%) scale(1.06); box-shadow:0 0 0 5px rgba(20,27,55,.9),0 0 32px rgba(217,195,131,.9),inset 0 -6px 12px rgba(0,0,0,.35); }
  .centro:active:not(:disabled){ transform:translate(-50%,-50%) scale(.96); }
  .centro:disabled{ filter:grayscale(.6) brightness(.7); cursor:default; }
  #cf{ position:absolute; inset:-12%; width:124%; height:124%; pointer-events:none; z-index:4; }
  .ganador{ margin:18px auto 0; max-width:500px; min-height:84px; text-align:center; border:1px solid var(--border); border-radius:16px; padding:12px 16px; background:linear-gradient(160deg,rgba(28,35,80,.7),rgba(58,43,90,.55)); }
  .ganador small{ display:block; color:var(--ink-soft); font-size:.8rem; letter-spacing:.14em; text-transform:uppercase; }
  .ganador b{ display:block; font-family:'Cormorant',serif; font-style:italic; font-size:clamp(1.8rem,7vw,2.6rem); line-height:1.15; color:var(--gold); text-shadow:0 0 18px rgba(217,195,131,.45); word-break:break-word; }
  .ganador.pop b{ animation:pop .6s cubic-bezier(.2,1.6,.4,1); }
  @keyframes pop{ from{ transform:scale(.6); opacity:0; } to{ transform:none; opacity:1; } }
  .ganador .hint{ color:var(--ink-soft); font-style:italic; font-size:1.05rem; padding-top:14px; display:block; }

  /* ——— Panel ——— */
  .panel2{ display:grid; gap:12px; border:1px solid var(--border); border-radius:18px; background:rgba(16,22,48,.72); padding:16px; }
  .ph{ display:flex; align-items:baseline; justify-content:space-between; }
  .ph h2{ margin:0; font-family:'Cormorant',serif; font-style:italic; font-size:1.4rem; color:var(--gold); }
  .cnt2{ color:var(--ink-soft); font-size:.9rem; }
  .panel2 textarea{ width:100%; min-height:190px; box-sizing:border-box; padding:10px 12px; font:inherit; color:var(--ink); background:rgba(255,255,255,.05); border:1px solid var(--border); border-radius:12px; resize:vertical; line-height:1.5; }
  .panel2 textarea:focus{ outline:none; border-color:var(--gold-dim); }
  .fila2{ display:flex; gap:8px; flex-wrap:wrap; }
  .gbtn{ padding:6px 14px; border-radius:999px; font-family:'Cormorant',serif; font-style:italic; font-weight:600; font-size:1rem; cursor:pointer; color:var(--gold); border:1px solid rgba(217,195,131,.5); background:rgba(217,195,131,.08); }
  .gbtn:hover{ background:rgba(217,195,131,.22); } .gbtn:disabled{ opacity:.5; cursor:default; }
  .gbtn.suave{ color:var(--ink-soft); border-color:var(--border); background:none; font-size:.92rem; }
  label.sw{ display:flex; align-items:center; justify-content:space-between; gap:12px; padding:9px 12px; border:1px solid var(--border); border-radius:10px; background:rgba(255,255,255,.03); cursor:pointer; color:var(--ink); }
  label.sw input{ -webkit-appearance:none; appearance:none; flex:none; width:42px !important; height:24px; margin:0; padding:0; border-radius:99px; border:1px solid var(--border); background:rgba(255,255,255,.1); position:relative; cursor:pointer; transition:background .2s,border-color .2s; }
  label.sw input::after{ content:''; position:absolute; top:2px; left:2px; width:18px; height:18px; border-radius:50%; background:var(--ink-soft); transition:transform .2s,background .2s; }
  label.sw input:checked{ background:rgba(217,195,131,.3); border-color:var(--gold); }
  label.sw input:checked::after{ transform:translateX(18px); background:var(--gold); }
  .hh{ display:flex; align-items:center; justify-content:space-between; margin-top:2px; }
  .hh b{ color:var(--gold); font-family:'Cormorant',serif; font-style:italic; font-size:1.2rem; }
  .hist{ margin:6px 0 0; padding-left:2.6em; color:var(--ink-soft); max-height:170px; overflow:auto; }
  .hist li:last-child{ color:var(--gold); }
  .kbd{ font-size:.78rem; color:var(--ink-soft); text-align:center; }
</style>
<script src="js/temporadas.js"></script>
</head><body>
<div class="stars" id="starsLayer" aria-hidden="true"></div>
<div class="mist m1" aria-hidden="true"></div>
<div class="mist m2" aria-hidden="true"></div>
<div class="moon" aria-hidden="true"></div>
<div class="wrap">
  <a class="back-link" href="index.html">← Volver al índice</a>
  <header class="top"><div><div class="title-wrap"><h1>Ruleta</h1></div><p class="subtitle">Escribe las opciones que quieras (una por línea) y gira. Se guardan en este navegador.</p></div></header>
  <div class="rl">
    <div>
      <div class="stage">
        <div class="rueda" id="rueda">
          <div class="flecha" id="flecha"><svg viewBox="0 -10 60 92" aria-hidden="true"><defs><linearGradient id="gp" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff3bf"/><stop offset=".5" stop-color="#e0c26a"/><stop offset="1" stop-color="#8a6a22"/></linearGradient><radialGradient id="gj" cx=".35" cy=".3"><stop offset="0" stop-color="#ffd6e8"/><stop offset=".6" stop-color="#c2417c"/><stop offset="1" stop-color="#5b1236"/></radialGradient></defs><path d="M30 78 L6 30 A26 26 0 1 1 54 30 Z" fill="url(#gp)" stroke="#5b4513" stroke-width="2"/><circle cx="30" cy="21" r="11" fill="url(#gj)" stroke="#5b4513" stroke-width="2"/><circle cx="26.5" cy="17.5" r="3" fill="#fff" opacity=".7"/></svg></div>
          <canvas id="cv" width="1200" height="1200" aria-label="Ruleta"></canvas>
          <button class="centro" id="gira" type="button">Girar</button>
          <canvas id="cf" width="620" height="620" aria-hidden="true"></canvas>
        </div>
      </div>
      <div class="ganador" id="ganBox" role="status" aria-live="polite"><small id="ganEt"></small><b id="gan"></b><span class="hint" id="ganHint">Pulsa la ruleta o la tecla espacio ✨</span></div>
    </div>
    <div class="panel2">
      <div class="ph"><h2>Opciones</h2><span class="cnt2" id="cnt"></span></div>
      <textarea id="ops" placeholder="Una opción por línea&#10;Ayaka&#10;Kazuha&#10;Venti" aria-label="Opciones"></textarea>
      <div class="fila2"><button class="gbtn" id="mezcla" type="button">Mezclar</button><button class="gbtn" id="team" type="button">Personajes del team</button><button class="gbtn suave" id="ejemplo" type="button">Ejemplo</button><button class="gbtn suave" id="vacia" type="button">Vaciar</button></div>
      <label class="sw"><span>Quitar de la ruleta a quien salga</span><input type="checkbox" id="quita"></label>
      <label class="sw"><span>Sonido al girar</span><input type="checkbox" id="snd"></label>
      <div><div class="hh"><b>Han salido</b><button class="gbtn suave" id="limpiaH" type="button" style="padding:1px 10px">Borrar</button></div><ol class="hist" id="hist"></ol></div>
    </div>
  </div>
</div>
<script type="module">
import { sb } from './js/supabase-sesion.js';
const $ = id => document.getElementById(id);
(function(){ const l = $('starsLayer'), fr = document.createDocumentFragment(); for (let i = 0; i < 30; i++){ const s = document.createElement('span'); s.className = 'star'; const z = (Math.random()*1.6+.8).toFixed(2); s.style.cssText = `left:${Math.random()*100}%;top:${Math.random()*100}%;width:${z}px;height:${z}px;animation-delay:${(Math.random()*4).toFixed(2)}s`; fr.appendChild(s); } l.appendChild(fr); })();

// Paleta: [centro, borde] por sector (más claro hacia el centro)
const PAL = [['#4a5cc0','#1f2a66'],['#9a5fc4','#4a2470'],['#d9a93f','#7a5a14'],['#3fa6a0','#16504e'],['#d0587f','#6b1f3d'],['#5b97e0','#1f4a8a'],['#c9743a','#6a3414'],['#7a5fc4','#33246e']];
const MAX = 60, TAU = Math.PI * 2;
const cv = $('cv'), g = cv.getContext('2d'), W = cv.width, C = W / 2;
const RIM = 46, RW = C - 6 - RIM;           // radio de la zona de sectores
let ang = 0, girando = false, hist = [], dim = -1, destello = 0, luces = 0;

const guarda = () => { try { localStorage.setItem('mc_ruleta', JSON.stringify({ o: $('ops').value, q: $('quita').checked, s: $('snd').checked, h: hist })); } catch (e) {} };
const carga = () => { try { const d = JSON.parse(localStorage.getItem('mc_ruleta') || 'null'); if (d){ $('ops').value = d.o || ''; $('quita').checked = !!d.q; $('snd').checked = !!d.s; hist = d.h || []; } } catch (e) {} };
const opciones = () => $('ops').value.split('\n').map(x => x.trim()).filter(Boolean).slice(0, MAX);
const colorDe = (i, n) => { let k = i % PAL.length; if (n > 1 && i === n - 1 && k === 0) k = 3; return PAL[k]; };

function dibuja(){
  const O = opciones(), n = O.length;
  g.clearRect(0, 0, W, W);
  // ——— aro dorado con luces ———
  const rim = g.createLinearGradient(0, 0, W, W); rim.addColorStop(0, '#fff3bf'); rim.addColorStop(.35, '#d9b95e'); rim.addColorStop(.7, '#8a6a22'); rim.addColorStop(1, '#f1dc8e');
  g.beginPath(); g.arc(C, C, C - 4, 0, TAU); g.arc(C, C, RW, 0, TAU, true); g.fillStyle = rim; g.fill('evenodd');
  g.beginPath(); g.arc(C, C, RW + 2, 0, TAU); g.strokeStyle = 'rgba(30,20,4,.6)'; g.lineWidth = 4; g.stroke();
  const NL = 28;
  for (let i = 0; i < NL; i++){
    const a = i / NL * TAU, x = C + Math.cos(a) * (C - 4 - RIM / 2), y = C + Math.sin(a) * (C - 4 - RIM / 2);
    const on = girando ? ((i + Math.floor(luces)) % 2 === 0) : (destello > 0 ? (Math.floor(destello / 6) % 2 === i % 2) : i % 2 === 0);
    const rg = g.createRadialGradient(x - 2, y - 2, 1, x, y, 11);
    if (on){ rg.addColorStop(0, '#fffbe6'); rg.addColorStop(.5, '#ffe79a'); rg.addColorStop(1, '#c79a2e'); g.shadowColor = 'rgba(255,230,140,.9)'; g.shadowBlur = 16; }
    else { rg.addColorStop(0, '#d9c58a'); rg.addColorStop(1, '#6b5420'); g.shadowBlur = 0; }
    g.beginPath(); g.arc(x, y, 9, 0, TAU); g.fillStyle = rg; g.fill(); g.shadowBlur = 0;
  }
  // ——— sectores ———
  if (!n){
    g.beginPath(); g.arc(C, C, RW, 0, TAU); g.fillStyle = '#141b37'; g.fill();
    g.fillStyle = '#9aa3c9'; g.font = "italic 600 54px Cormorant, serif"; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText('Añade opciones →', C, C);
    return;
  }
  const a = TAU / n;
  for (let i = 0; i < n; i++){
    const a0 = ang + i * a - Math.PI / 2, [c1, c2] = colorDe(i, n);
    const rg = g.createRadialGradient(C, C, RW * .12, C, C, RW); rg.addColorStop(0, c1); rg.addColorStop(1, c2);
    g.beginPath(); g.moveTo(C, C); g.arc(C, C, RW, a0, a0 + a); g.closePath(); g.fillStyle = rg; g.fill();
    // brillo suave en cada sector
    const sh = g.createLinearGradient(C + Math.cos(a0) * RW, C + Math.sin(a0) * RW, C + Math.cos(a0 + a) * RW, C + Math.sin(a0 + a) * RW);
    sh.addColorStop(0, 'rgba(255,255,255,.14)'); sh.addColorStop(.5, 'rgba(255,255,255,0)'); sh.addColorStop(1, 'rgba(0,0,0,.18)');
    g.fillStyle = sh; g.fill();
    if (n > 1){ g.beginPath(); g.moveTo(C, C); g.lineTo(C + Math.cos(a0) * RW, C + Math.sin(a0) * RW); g.strokeStyle = 'rgba(233,215,154,.75)'; g.lineWidth = 3; g.stroke(); }
    // texto
    g.save(); g.translate(C, C); g.rotate(a0 + a / 2); g.textAlign = 'right'; g.textBaseline = 'middle';
    let fs = Math.min(64, Math.max(16, TAU * RW / n * .46)), t = O[i]; const f = s => `700 ${s}px Cormorant, Georgia, serif`;
    g.font = f(fs); const maxw = RW * .66;
    while (g.measureText(t).width > maxw && fs > 14){ fs -= 2; g.font = f(fs); }
    if (g.measureText(t).width > maxw){ while (t.length > 3 && g.measureText(t + '…').width > maxw) t = t.slice(0, -1); t += '…'; }
    g.shadowColor = 'rgba(0,0,0,.65)'; g.shadowBlur = 6; g.shadowOffsetY = 2; g.fillStyle = '#fff'; g.fillText(t, RW - 30, 0); g.restore();
  }
  // sectores apagados cuando hay ganador
  if (dim >= 0 && n > 1){
    for (let i = 0; i < n; i++){ if (i === dim) continue; const a0 = ang + i * a - Math.PI / 2; g.beginPath(); g.moveTo(C, C); g.arc(C, C, RW, a0, a0 + a); g.closePath(); g.fillStyle = 'rgba(6,8,22,.55)'; g.fill(); }
    const a0 = ang + dim * a - Math.PI / 2; g.beginPath(); g.moveTo(C, C); g.arc(C, C, RW - 2, a0, a0 + a); g.closePath(); g.strokeStyle = '#fff3bf'; g.lineWidth = 6; g.shadowColor = '#ffe79a'; g.shadowBlur = 22; g.stroke(); g.shadowBlur = 0;
  }
  // anillo interior (alrededor del botón)
  g.beginPath(); g.arc(C, C, RW * .25, 0, TAU); g.fillStyle = 'rgba(10,14,34,.55)'; g.fill(); g.strokeStyle = 'rgba(233,215,154,.8)'; g.lineWidth = 4; g.stroke();
}

// ——— puntero que “salta” con cada sector ———
const flecha = $('flecha'); let fa = 0, fv = 0;
function resorte(){ fv += (0 - fa) * .35; fv *= .6; fa += fv; flecha.style.transform = `translateX(-50%) rotate(${fa.toFixed(2)}deg)`; if (Math.abs(fa) > .05 || Math.abs(fv) > .05) requestAnimationFrame(resorte); else flecha.style.transform = 'translateX(-50%)'; }
function tick(){ fv = -9; fa = Math.min(fa, 0); requestAnimationFrame(resorte); sonido(); }
let AC = null;
function sonido(){ if (!$('snd').checked) return; try { AC = AC || new (window.AudioContext || window.webkitAudioContext)(); const o = AC.createOscillator(), v = AC.createGain(); o.type = 'triangle'; o.frequency.value = 700 + Math.random() * 120; v.gain.setValueAtTime(.12, AC.currentTime); v.gain.exponentialRampToValueAtTime(.001, AC.currentTime + .07); o.connect(v); v.connect(AC.destination); o.start(); o.stop(AC.currentTime + .08); } catch (e) {} }
function fanfarria(){ if (!$('snd').checked || !AC) return; [660, 880, 1100].forEach((f, i) => { const o = AC.createOscillator(), v = AC.createGain(), t = AC.currentTime + i * .11; o.type = 'sine'; o.frequency.value = f; v.gain.setValueAtTime(.001, t); v.gain.exponentialRampToValueAtTime(.15, t + .02); v.gain.exponentialRampToValueAtTime(.001, t + .35); o.connect(v); v.connect(AC.destination); o.start(t); o.stop(t + .4); }); }

// ——— confeti ———
const cf = $('cf'), cx = cf.getContext('2d'); let parts = [], cfOn = false;
function confeti(){
  const S = cf.width; parts = [];
  for (let i = 0; i < 90; i++){ const a = Math.random() * TAU, v = 5 + Math.random() * 9; parts.push({ x: S / 2, y: S / 2, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 3, r: 3 + Math.random() * 5, c: ['#fff3bf', '#e0c26a', '#c2417c', '#5b97e0', '#3fa6a0', '#9a5fc4'][i % 6], rot: Math.random() * 6, vr: (Math.random() - .5) * .4, life: 1 }); }
  if (!cfOn){ cfOn = true; requestAnimationFrame(paso); }
  function paso(){
    cx.clearRect(0, 0, S, S); let vivas = 0;
    parts.forEach(p => { p.x += p.vx; p.y += p.vy; p.vy += .22; p.vx *= .985; p.rot += p.vr; p.life -= .011; if (p.life <= 0) return; vivas++; cx.save(); cx.globalAlpha = Math.max(0, p.life); cx.translate(p.x, p.y); cx.rotate(p.rot); cx.fillStyle = p.c; cx.fillRect(-p.r, -p.r / 2, p.r * 2, p.r); cx.restore(); });
    if (vivas) requestAnimationFrame(paso); else { cfOn = false; cx.clearRect(0, 0, S, S); }
  }
}

function pinta(){
  const n = opciones().length;
  $('cnt').textContent = n + (n === 1 ? ' opción' : ' opciones') + (n >= MAX ? ' (máximo)' : '');
  $('gira').disabled = girando || n < 2;
  const hs = $('hist'); hs.innerHTML = ''; hist.forEach(x => { const li = document.createElement('li'); li.textContent = x; hs.appendChild(li); }); hs.scrollTop = hs.scrollHeight;
  dibuja();
}
function gira(){
  const O = opciones(), n = O.length; if (girando || n < 2) return;
  girando = true; dim = -1; destello = 0; $('ganEt').textContent = ''; $('gan').textContent = ''; $('ganHint').style.display = 'block'; $('ganHint').textContent = 'Girando…'; $('ganBox').classList.remove('pop'); $('gira').disabled = true;
  const a = TAU / n, gana = Math.floor(Math.random() * n);
  const destino = -(gana + .15 + Math.random() * .7) * a, vueltas = (5 + Math.floor(Math.random() * 3)) * TAU, ini = ang % TAU, fin = destino - vueltas;
  const dur = 5200 + Math.random() * 1400, t0 = performance.now(), ease = x => 1 - Math.pow(1 - x, 4);
  let ultimo = Math.floor(-ini / a);
  (function paso(ts){
    const x = Math.min(1, (ts - t0) / dur); ang = ini + (fin - ini) * ease(x); luces += .22;
    const idx = Math.floor(-ang / a); if (idx !== ultimo){ ultimo = idx; tick(); }
    dibuja();
    if (x < 1) return requestAnimationFrame(paso);
    girando = false; const ganador = O[gana]; dim = gana;
    $('ganEt').textContent = 'Ha salido'; $('gan').textContent = ganador; $('ganHint').style.display = 'none'; void $('ganBox').offsetWidth; $('ganBox').classList.add('pop');
    hist.push(ganador); hist = hist.slice(-50); confeti(); fanfarria();
    destello = 90; (function dest(){ destello--; dibuja(); if (destello > 0) requestAnimationFrame(dest); else dibuja(); })();
    if ($('quita').checked){ const L = $('ops').value.split('\n'); let k = -1, vis = 0; for (let j = 0; j < L.length; j++){ if (L[j].trim()){ if (vis === gana){ k = j; break; } vis++; } } if (k >= 0){ L.splice(k, 1); $('ops').value = L.join('\n'); } }
    guarda(); pinta();
  })(t0);
}
$('gira').onclick = gira; cv.onclick = gira;
document.addEventListener('keydown', e => { if (e.code === 'Space' && !/^(TEXTAREA|INPUT|BUTTON)$/.test(document.activeElement.tagName)){ e.preventDefault(); gira(); } });
const cambio = () => { if (!girando){ dim = -1; guarda(); pinta(); } };
$('ops').addEventListener('input', cambio);
$('quita').onchange = guarda; $('snd').onchange = guarda;
$('mezcla').onclick = () => { if (girando) return; const O = opciones(); for (let i = O.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [O[i], O[j]] = [O[j], O[i]]; } $('ops').value = O.join('\n'); cambio(); };
$('vacia').onclick = () => { if (girando) return; $('ops').value = ''; $('gan').textContent = ''; $('ganEt').textContent = ''; $('ganHint').style.display = 'block'; $('ganHint').textContent = 'Pulsa la ruleta o la tecla espacio ✨'; cambio(); };
$('ejemplo').onclick = () => { if (girando) return; $('ops').value = 'Ayaka\nKazuha\nVenti\nZhongli\nXiao\nNahida'; cambio(); };
$('team').onclick = async () => {
  if (girando) return; const b = $('team'); b.disabled = true; const t = b.textContent; b.textContent = 'Cargando…';
  try { const r = await sb.from('ocupados').select('data'); const N = (r.data || []).map(x => (x.data || {}).nombre).filter(Boolean).sort((p, q) => p.localeCompare(q, 'es')); if (N.length){ $('ops').value = N.join('\n'); cambio(); } } catch (e) {}
  b.disabled = false; b.textContent = t;
};
$('limpiaH').onclick = () => { hist = []; guarda(); pinta(); };
carga(); pinta();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(dibuja);
</script>
</body>
</html>
