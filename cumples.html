<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cumpleaños · Moonlight Team</title>
<meta name="description" content="Calendario de cumpleaños de Moonlight Team.">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,500;0,600;1,500;1,600&family=Crimson+Pro:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
<style>
  .wrap{ max-width:820px; }
  .top h1{ font-size:clamp(1.9rem,8vw,3rem); line-height:1.1; }
  .nav{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin:6px 0 10px; }
  .nav h2{ margin:0; font-family:'Cormorant',serif; font-style:italic; font-size:1.7rem; color:var(--gold); text-transform:capitalize; }
  .nb{ width:38px; height:38px; border-radius:50%; border:1px solid var(--border); background:rgba(16,22,48,.72); color:var(--gold); font-size:1.2rem; cursor:pointer; }
  .nb:hover{ border-color:var(--gold-dim); }
  .hoy-btn{ font-size:.9rem; padding:5px 12px; border-radius:999px; border:1px solid var(--border); background:none; color:var(--ink-soft); cursor:pointer; font-family:inherit; }
  .cal{ display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:4px; }
  .dn{ text-align:center; font-size:.8rem; color:var(--ink-soft); padding:4px 0; }
  .d{ min-height:78px; border:1px solid var(--border); border-radius:10px; background:rgba(16,22,48,.6); padding:4px 5px; font-size:.85rem; overflow:hidden; cursor:default; }
  .d.v{ background:none; border-color:transparent; }
  .d .n{ color:var(--ink-soft); font-size:.8rem; }
  .d.hoy{ border-color:var(--gold); }
  .d.hoy .n{ color:var(--gold); font-weight:600; }
  .d.cu{ cursor:pointer; background:rgba(217,195,131,.1); border-color:rgba(217,195,131,.45); }
  .d.sel{ box-shadow:0 0 0 2px var(--gold); }
  .d .p{ display:block; font-size:.78rem; line-height:1.2; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .d .p::before{ content:'🎂 '; font-size:.7rem; }
  .d .mas{ font-size:.72rem; color:var(--gold); }
  .det{ margin-top:12px; border:1px solid var(--border); border-radius:12px; background:rgba(16,22,48,.72); padding:10px 14px; }
  .det a{ color:var(--gold); }
  h2.s{ margin:26px 0 8px; font-family:'Cormorant',serif; font-style:italic; font-size:1.4rem; color:var(--gold); }
  .prox{ border:1px solid var(--border); border-radius:14px; background:rgba(16,22,48,.72); padding:4px 16px; }
  .pr{ display:flex; align-items:center; gap:12px; padding:10px 0; border-bottom:1px solid var(--border); text-decoration:none; color:var(--ink); }
  .pr:last-child{ border:0; }
  .pr .f{ min-width:92px; color:var(--gold); font-family:'Cormorant',serif; font-style:italic; font-size:1.1rem; text-transform:capitalize; }
  .pr b{ flex:1; font-weight:600; }
  .pr small{ color:var(--ink-soft); }
  .pr.hoy small{ color:var(--gold); }
  .vacio{ color:var(--ink-soft); font-style:italic; padding:12px 0; }
  .nota{ font-size:.85rem; color:var(--ink-soft); margin-top:8px; }
  @media(max-width:560px){ .d{ min-height:56px; padding:3px; } .d .p{ font-size:0; } .d .p::before{ font-size:.85rem; } .d .mas{ display:none; } .d.cu .n::after{ content:attr(data-c); color:var(--gold); margin-left:3px; } }
</style>
<script src="js/temporadas.js"></script>
</head><body>
<div class="stars" id="starsLayer" aria-hidden="true"></div>
<div class="mist m1" aria-hidden="true"></div>
<div class="mist m2" aria-hidden="true"></div>
<div class="moon" aria-hidden="true"></div>
<div class="wrap">
  <a class="back-link" href="index.html">← Volver al índice</a>
  <header class="top">
    <div>
      <div class="title-wrap"><h1>Cumpleaños</h1></div>
      <p class="subtitle">Solo salen quienes han activado «Registrar mi cumpleaños» en su ficha.</p>
    </div>
  </header>
  <div class="nav"><button class="nb" id="prev" type="button" aria-label="Mes anterior">‹</button><div style="text-align:center"><h2 id="mes"></h2><button class="hoy-btn" id="hoyBtn" type="button">Hoy</button></div><button class="nb" id="next" type="button" aria-label="Mes siguiente">›</button></div>
  <div class="cal" id="cal"></div>
  <div class="det" id="det" hidden></div>
  <h2 class="s">Próximos cumpleaños</h2>
  <div class="prox" id="prox"></div>
  <p class="nota">Para aparecer aquí, abre tu ficha con tu carnet y activa «Registrar mi cumpleaños».</p>
</div>
<script type="module">
import { sb } from './js/supabase-sesion.js';
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const clave = s => String(s || '').trim().toLowerCase().replace(/\s+/g, ' ');
(function(){ const l = $('starsLayer'), fr = document.createDocumentFragment(); for (let i = 0; i < 30; i++){ const s = document.createElement('span'); s.className = 'star'; const z = (Math.random()*1.6+.8).toFixed(2); s.style.cssText = `left:${Math.random()*100}%;top:${Math.random()*100}%;width:${z}px;height:${z}px;animation-delay:${(Math.random()*4).toFixed(2)}s`; fr.appendChild(s); } l.appendChild(fr); })();
const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const hoyES = () => { const p = new Intl.DateTimeFormat('en-CA', { timeZone: 'Europe/Madrid' }).format(new Date()).split('-').map(Number); return { y: p[0], m: p[1], d: p[2] }; };
const bisiesto = y => (y % 4 === 0 && y % 100 !== 0) || y % 400 === 0;
let C = [];   // { nombre, m, d }
let H = hoyES(), vy = H.y, vm = H.m, sel = null;
// 29 feb en año no bisiesto se celebra el 28
const diaEn = (c, y) => (c.m === 2 && c.d === 29 && !bisiesto(y)) ? 28 : c.d;
async function load(){
  const [oc, fi] = await Promise.all([sb.from('ocupados').select('data'), sb.from('fichas').select('personaje_key,data')]);
  const nom = {}; (oc.data || []).forEach(r => { const n = (r.data || {}).nombre; if (n) nom[clave(n)] = n; });
  C = [];
  (fi.data || []).forEach(r => { const d = r.data || {}; if (d.oculta || !d.cumple || !nom[r.personaje_key]) return; const [m, dd] = d.cumple.split('-').map(Number); if (m >= 1 && m <= 12 && dd >= 1 && dd <= 31) C.push({ nombre: nom[r.personaje_key], m, d: dd }); });
  pinta(); proximos();
}
function pinta(){
  $('mes').textContent = MESES[vm - 1] + ' ' + vy;
  const prim = (new Date(vy, vm - 1, 1).getDay() + 6) % 7, dias = new Date(vy, vm, 0).getDate();
  let h = ['L','M','X','J','V','S','D'].map(x => `<div class="dn">${x}</div>`).join('');
  for (let i = 0; i < prim; i++) h += '<div class="d v"></div>';
  for (let d = 1; d <= dias; d++){
    const l = C.filter(c => c.m === vm && diaEn(c, vy) === d), es = H.y === vy && H.m === vm && H.d === d;
    h += `<div class="d${es ? ' hoy' : ''}${l.length ? ' cu' : ''}${sel === d ? ' sel' : ''}" data-d="${d}"><span class="n" data-c="${l.length || ''}">${d}</span>${l.slice(0, 2).map(c => `<span class="p">${esc(c.nombre)}</span>`).join('')}${l.length > 2 ? `<span class="mas">+${l.length - 2} más</span>` : ''}</div>`;
  }
  $('cal').innerHTML = h;
  const dt = $('det');
  if (sel){ const l = C.filter(c => c.m === vm && diaEn(c, vy) === sel); dt.hidden = !l.length; dt.innerHTML = l.length ? `<b>${sel} de ${MESES[vm - 1]}:</b> ` + l.map(c => `<a href="ficha.html?p=${encodeURIComponent(c.nombre)}">${esc(c.nombre)}</a>`).join(', ') : ''; } else dt.hidden = true;
}
function proximos(){
  const base = Date.UTC(H.y, H.m - 1, H.d);
  const L = C.map(c => { let y = H.y, t = Date.UTC(y, c.m - 1, diaEn(c, y)); if (t < base){ y++; t = Date.UTC(y, c.m - 1, diaEn(c, y)); } return { ...c, t, y, falta: Math.round((t - base) / 864e5), dd: diaEn(c, y) }; })
    .sort((a, b) => a.t - b.t || a.nombre.localeCompare(b.nombre, 'es')).slice(0, 5);
  $('prox').innerHTML = L.length ? L.map(c => `<a class="pr${c.falta === 0 ? ' hoy' : ''}" href="ficha.html?p=${encodeURIComponent(c.nombre)}"><span class="f">${c.dd} ${MESES[c.m - 1].slice(0, 3)}</span><b>${esc(c.nombre)}</b><small>${c.falta === 0 ? '¡Hoy! 🎉' : c.falta === 1 ? 'Mañana' : 'En ' + c.falta + ' días'}</small></a>`).join('') : '<p class="vacio">Todavía nadie ha registrado su cumpleaños.</p>';
}
$('prev').onclick = () => { vm--; if (vm < 1){ vm = 12; vy--; } sel = null; pinta(); };
$('next').onclick = () => { vm++; if (vm > 12){ vm = 1; vy++; } sel = null; pinta(); };
$('hoyBtn').onclick = () => { vy = H.y; vm = H.m; sel = null; pinta(); };
$('cal').addEventListener('click', e => { const d = e.target.closest('.d.cu'); if (!d) return; sel = +d.dataset.d === sel ? null : +d.dataset.d; pinta(); });
load();
</script>
</body>
</html>
