<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Votaciones · Moonlight Team</title>
<meta name="description" content="Votaciones de Moonlight Team: vota con tu carnet y mira los resultados.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
  .wrap{ max-width:820px; }
  .top h1{ font-size:clamp(1.9rem,8vw,3rem); line-height:1.1; }
  .aviso{ margin:4px 0 16px; padding:10px 14px; border:1px solid rgba(125,255,176,.4); border-radius:10px; background:rgba(125,255,176,.07); font-size:.95rem; line-height:1.45; }

  .vl{ display:grid; gap:14px; margin-bottom:30px; }
  .vc{ border:1px solid var(--border); border-radius:12px; background:rgba(16,22,48,.72); padding:16px 18px; }
  .vc h2{ margin:0 0 4px; font-family:'Cormorant',serif; font-style:italic; font-size:1.55rem; color:var(--gold); display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
  .chip{ font-family:'Crimson Pro',serif; font-style:normal; font-size:.82rem; padding:2px 10px; border-radius:999px; border:1px solid var(--border); color:var(--ink-soft); }
  .chip.on{ color:#7dffb0; border-color:rgba(125,255,176,.5); background:rgba(125,255,176,.08); }
  .chip.pr{ color:var(--gold); border-color:rgba(217,195,131,.5); }

  .gbtn{ padding:6px 14px; border-radius:999px; font-family:'Cormorant',serif; font-style:italic; font-weight:600; font-size:1rem; cursor:pointer; color:var(--gold); border:1px solid rgba(217,195,131,.5); background:rgba(217,195,131,.08); }
  .gbtn:hover{ background:rgba(217,195,131,.22); } .gbtn[disabled]{ opacity:.5; cursor:default; }
  .gbtn.suave{ color:var(--ink-soft); border-color:var(--border); background:none; font-size:.92rem; }
  .pend{ color:var(--ink-soft); font-style:italic; margin:8px 0; }
  .quien{ display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }

  dialog.adv{ width:min(720px, calc(100vw - 20px)); max-width:none; max-height:calc(100dvh - 20px); padding:0; border:1px solid var(--gold-dim); border-radius:14px; background:#101630; color:var(--ink); overflow:hidden; }

  .ed-x{ background:none; border:none; color:var(--ink-soft); font-size:1.7rem; line-height:1; cursor:pointer; }
  .ed-body{ overflow-x:hidden; overflow-y:auto; padding:6px 20px 14px; flex:1; }

  .cp{ display:flex; flex-direction:column; gap:4px; margin:8px 0; color:var(--ink-soft); font-size:.9rem; }
  .cp > span small{ opacity:.7; }
  .ed input[type=text], .ed input[type=datetime-local], .ed input[type=number], .ed select, .ed textarea{ width:100%; box-sizing:border-box; padding:9px 11px; font-family:inherit; font-size:1rem; color:var(--ink); background:#141b37; border:1px solid var(--border); border-radius:8px; color-scheme:dark; }
  .ed input:focus, .ed textarea:focus, .ed select:focus{ outline:none; border-color:var(--gold); box-shadow:0 0 0 3px rgba(217,195,131,.15); }
  .ed textarea{ min-height:56px; resize:vertical; }
  .g2 > *{ min-width:0; }
  .g2{ display:grid; grid-template-columns:1fr 1fr; gap:10px; } @media (max-width:460px){ .g2{ grid-template-columns:1fr; } }
  .portada{ position:relative; border:1.5px dashed var(--border); border-radius:10px; min-height:60px; display:flex; align-items:center; justify-content:center; overflow:hidden; cursor:pointer; color:var(--ink-soft); background:rgba(255,255,255,.03); text-align:center; font-size:.95rem; }
  .portada:hover{ border-color:var(--gold-dim); }
  .portada img{ display:block; width:100%; max-height:190px; object-fit:cover; }
  .portada .q{ position:absolute; top:6px; right:6px; background:rgba(8,12,30,.8); border:1px solid var(--border); color:var(--ink); border-radius:999px; font-size:.8rem; padding:2px 10px; cursor:pointer; }
  .orow{ display:flex; gap:8px; align-items:center; margin:6px 0; }
  .orow input[type=text]{ flex:1; }
  .oimg{ flex:none; width:42px; height:42px; border-radius:8px; border:1px dashed var(--border); background:rgba(255,255,255,.03) center/cover no-repeat; color:var(--ink-soft); cursor:pointer; font-size:1.1rem; display:flex; align-items:center; justify-content:center; padding:0; }
  .oimg:hover{ border-color:var(--gold-dim); }
  .odel{ flex:none; width:32px; height:32px; border-radius:50%; border:1px solid var(--border); background:none; color:var(--ink-soft); cursor:pointer; }
  .odel:hover{ color:#ff8a8a; border-color:#ff8a8a; }
  .sw{ display:flex; align-items:center; justify-content:space-between; gap:14px; padding:10px 12px; margin:6px 0; border:1px solid var(--border); border-radius:10px; background:rgba(255,255,255,.03); cursor:pointer; }
  .sw b{ display:block; font-weight:600; color:var(--ink); font-size:1rem; } .sw small{ color:var(--ink-soft); font-size:.84rem; }
  .sw input{ position:absolute; opacity:0; pointer-events:none; }
  .sw i{ flex:none; width:44px; height:25px; border-radius:999px; background:#2a3256; position:relative; transition:background .2s; }
  .sw i::after{ content:''; position:absolute; top:3px; left:3px; width:19px; height:19px; border-radius:50%; background:#cfd6f5; transition:transform .2s; }
  .sw input:checked + i{ background:var(--gold); } .sw input:checked + i::after{ transform:translateX(19px); background:#241c0c; }
  .sw input:focus-visible + i{ box-shadow:0 0 0 3px rgba(217,195,131,.35); }
  .gal{ display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px; margin:12px 0; }
  .gi{ margin:0; border:1px solid var(--border); border-radius:10px; overflow:hidden; background:rgba(255,255,255,.04); display:flex; flex-direction:column; }
  .gi.sel{ border-color:var(--gold); box-shadow:0 0 0 1px var(--gold); }
  .gi img{ width:100%; aspect-ratio:4/3; object-fit:cover; display:block; cursor:zoom-in; }
  .gi figcaption{ display:flex; align-items:center; justify-content:space-between; gap:6px; padding:6px 10px; font-size:.95rem; }
  .like{ background:none; border:none; font-size:1.6rem; line-height:1; color:#ff7a90; cursor:pointer; padding:0 2px; } .like:hover{ transform:scale(1.15); }
  .cnt{ color:#ff7a90; font-weight:600; }
  .nums{ display:flex; flex-wrap:wrap; gap:6px; margin:12px 0 4px; }
  .num{ min-width:42px; height:42px; border-radius:50%; border:1px solid var(--border); background:rgba(255,255,255,.05); color:var(--ink); font-family:'Cormorant',serif; font-size:1.2rem; font-weight:600; cursor:pointer; }
  .num:hover{ border-color:var(--gold-dim); } .num.sel{ background:var(--gold); color:#241c0c; border-color:var(--gold); }
  .media{ font-family:'Cormorant',serif; font-style:italic; font-weight:600; font-size:2.4rem; color:var(--gold); margin:8px 0 0; } .media small{ font-size:1rem; color:var(--ink-soft); font-style:normal; font-family:'Crimson Pro',serif; }
  .histo{ display:flex; align-items:flex-end; gap:4px; height:110px; margin:10px 0 4px; }
  .hb{ flex:1; min-width:0; height:100%; display:flex; flex-direction:column; justify-content:flex-end; align-items:center; font-size:.78rem; color:var(--ink-soft); text-align:center; }
  .hb i{ width:100%; background:rgba(217,195,131,.35); border-radius:4px 4px 0 0; min-height:2px; display:block; } .hb.tuya i{ background:var(--gold); } .hb b{ font-weight:400; }
  dialog.zoom{ border:none; background:transparent; padding:0; max-width:92vw; max-height:92dvh; color:var(--ink); text-align:center; }
  dialog.zoom::backdrop{ background:rgba(4,6,18,.88); } dialog.zoom img{ max-width:92vw; max-height:80dvh; border-radius:10px; } dialog.zoom p{ margin:8px 0 0; }
  .seg{ display:grid; grid-template-columns:repeat(auto-fit,minmax(125px,1fr)); gap:6px; }
  .tf{ flex:1; min-width:140px; padding:8px 10px; font-family:inherit; font-size:1rem; color:var(--ink); background:#141b37; border:1px solid var(--border); border-radius:8px; }
  .gi .odel{ width:26px; height:26px; }
  .seg button{ padding:9px 6px; border-radius:8px; border:1px solid var(--border); background:rgba(255,255,255,.04); color:var(--ink-soft); font-family:inherit; font-size:.92rem; cursor:pointer; line-height:1.2; }
  .seg button.on{ border-color:var(--gold); color:var(--gold); background:rgba(217,195,131,.12); }
  .nota{ font-size:.84rem; color:var(--ink-soft); margin:4px 0; }
  .portada-v{ display:block; width:calc(100% + 36px); margin:-16px -18px 12px; max-height:190px; object-fit:cover; border-radius:12px 12px 0 0; }
  .op .th{ width:38px; height:38px; border-radius:6px; object-fit:cover; vertical-align:middle; margin-right:10px; }
  #toast{ position:fixed; left:50%; bottom:20px; transform:translate(-50%,20px); background:#141b37; border:1px solid var(--gold-dim); color:var(--ink); padding:9px 16px; border-radius:8px; opacity:0; transition:all .3s; z-index:30; pointer-events:none; max-width:90vw; text-align:center; }
  #toast.show{ opacity:1; transform:translate(-50%,0); }
</style>

<div class="stars" id="starsLayer" aria-hidden="true"></div>
<div class="mist m1" aria-hidden="true"></div>
<div class="mist m2" aria-hidden="true"></div>
<div class="moon" aria-hidden="true"></div>
<div class="wrap">
  <a class="back-link" href="index.html">← Volver al índice</a>
  <header class="top">
    <div>
      <div class="title-wrap"><h1>Votaciones</h1></div>
      <p class="subtitle">Decide con el resto del team. Para votar necesitas tu carnet.</p>
    </div>
    <button class="admin-toggle" id="adminToggleBtn">Acceso admin</button>

  <div class="fila" id="adminBar" hidden><button class="gbtn" id="nueva" type="button">+ Nueva votación</button></div>

</div>

</dialog>

<script type="module">
import { sb } from './js/supabase-sesion.js';
import { tokenActual, miMiembro } from './js/carnet.js';
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
(function(){ const l = $('starsLayer'), fr = document.createDocumentFragment(); for (let i = 0; i < 30; i++){ const s = document.createElement('span'); s.className = 'star'; const z = (Math.random()*1.6+.8).toFixed(2); s.style.cssText = `top:${Math.random()*100}%;left:${Math.random()*100}%;width:${z}px;height:${z}px`; s.style.setProperty('--dur', (Math.random()*3+2).toFixed(2)+'s'); s.style.setProperty('--delay', (Math.random()*5).toFixed(2)+'s'); s.style.setProperty('--o-min', '.2'); s.style.setProperty('--o-max', '.85'); fr.appendChild(s); } l.appendChild(fr); })();
const toast = t => { const e = $('toast'); e.textContent = t; e.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => e.classList.remove('show'), 3800); };
const porAlta = (a, b) => String((a.data || {}).createdAt || '').localeCompare(String((b.data || {}).createdAt || '')) || ((a.data || {}).orden || 0) - ((b.data || {}).orden || 0);
const fmt = d => new Date(d).toLocaleString('es-ES', { timeZone: 'Europe/Madrid', day: 'numeric', month: 'long', hour: '2-digit', minute: '2-digit' });
const aLocal = d => { const x = new Date(new Date(d).getTime() - new Date(d).getTimezoneOffset() * 60000); return x.toISOString().slice(0, 16); };
const MSG = { limite: 'Ya has subido el máximo de fotos.', fuera_de_plazo: 'El plazo de envío ya terminó.', sin_carnet: 'Necesitas tu carnet para votar.', no_existe: 'Esa votación ya no existe.', no_empezada: 'Esta votación aún no ha empezado.', cerrada: 'Esta votación ya está cerrada.', opcion_invalida: 'Elige una opción válida.', demasiadas: 'Has elegido demasiadas opciones.', ya_votaste: 'Ya has votado y no se puede cambiar.' };
let isAdmin = false, yo = null, V = [], mi = {}, res = {}, nombres = {}, miembros = [], carn = new Set(), quien = {}, abierta = {}, sel = {}, fotos = {}, fotosAdm = {};

async function load(){
  yo = await miMiembro();
  $('yo').textContent = yo ? '' : 'No hemos encontrado tu carnet en este navegador: puedes ver las votaciones, pero para votar abre tu enlace personal.';
  const { data } = await sb.from('votaciones').select('*').order('fin', { ascending: false }); V = data || [];
  const tk = tokenActual(); mi = {}; res = {};
  await Promise.all(V.map(async v => {
    if (yo){ const r = await sb.rpc('mi_voto', { p_votacion: v.id, p_token: tk }); mi[v.id] = r.data || null; }
    const r2 = await sb.rpc('votacion_resultados', { p_votacion: v.id }); res[v.id] = r2.data || null;
    if (v.tipo === 'concurso'){ const f = await sb.rpc('concurso_fotos', { p_votacion: v.id, p_token: tk }); fotos[v.id] = f.data || []; if (isAdmin){ const a = await sb.rpc('concurso_admin', { p_votacion: v.id }); fotosAdm[v.id] = a.data || []; } }
  }));
  if (isAdmin){
    const [m, o, c] = await Promise.all([sb.from('miembros').select('id,data'), sb.from('ocupados').select('id,data'), sb.from('carnets').select('miembro_id')]);
    const per = {}; (o.data || []).slice().sort(porAlta).forEach(x => { const d = x.data || {}; if (d.miembroId) (per[d.miembroId] = per[d.miembroId] || []).push(d.nombre); });
    miembros = (m.data || []).filter(r => !(r.data && (r.data.baneado || r.data.activo === false)) && per[r.id]); nombres = {};
    miembros.forEach(r => nombres[r.id] = (per[r.id] || []).join(', ') || (r.data || {}).apodoInterno || r.id);
    carn = new Set((c.data || []).map(x => x.miembro_id));
  }
  paint();
}
const estado = v => { const n = Date.now();
  if (v.tipo === 'concurso'){ if (n < new Date(v.envios_desde)) return 'pronto'; if (n <= new Date(v.envios_hasta)) return 'recogida'; if (n < new Date(v.inicio)) return 'espera'; }
  return n < new Date(v.inicio) ? 'pronto' : n > new Date(v.fin) ? 'cerrada' : 'abierta'; };
const opsDe = v => v.tipo === 'concurso' ? (fotos[v.id] || []).map(f => ({ id: f.id, texto: f.titulo || '', img: f.img, mia: f.mia })) : v.opciones;
const nom = (v, id) => v.tipo === 'numerica' ? id : id === 'blanco' ? 'En blanco' : ((opsDe(v).find(o => o.id === id) || {}).texto || (v.tipo === 'concurso' ? 'una foto' : id));
const BOTON = (propio, editando) => `<div class="fila"><button class="gbtn" data-votar="1" type="button">${propio ? 'Guardar cambio' : 'Votar'}</button>${editando ? '<button class="gbtn suave" data-cancel="1" type="button">Cancelar</button>' : ''}</div>`;
const nVotan = n => `<p class="vm">${n} ${n === 1 ? 'persona ha votado' : 'personas han votado'}.</p>`;
function formEnvio(v){
  const mias = (fotos[v.id] || []).filter(f => f.mia), N = v.fotos_por_miembro;
  const cab = `<p class="vm">Puedes subir hasta ${N} ${N === 1 ? 'foto' : 'fotos'} hasta el ${esc(fmt(v.envios_hasta))}. Se mostrarán sin tu nombre cuando empiece la votación (${esc(fmt(v.inicio))}) y no podrás votar la tuya.</p>`;
  if (!yo) return cab + '<p class="pend">Abre tu enlace personal (carnet) para poder subir tu foto.</p>';
  const grid = mias.length ? `<div class="gal">${mias.map(f => `<figure class="gi"><img src="${esc(imgUrl(f.img))}" alt="" data-zoom="${esc(f.id)}"><figcaption><span>${esc(f.titulo || 'Tu foto')}</span><button type="button" class="odel" data-quitar="${f.id}" title="Quitar mi foto">×</button></figcaption></figure>`).join('')}</div>` : '';
  return cab + grid + (mias.length < N ? '<div class="fila"><input class="tf" type="text" maxlength="80" placeholder="Título (opcional)"><button class="gbtn" data-subir="1" type="button">📷 Subir mi foto</button></div>' : '<p class="pend">✅ Ya has enviado tus fotos. Puedes quitarlas con la × hasta que termine el plazo.</p>');
}
function formVoto(v, ops, s, propio, editando){
  if (v.tipo === 'galeria' || v.tipo === 'concurso') return `<div class="gal">${ops.map(o => `<figure class="gi ${s.includes(o.id) ? 'sel' : ''}">${o.img ? `<img src="${esc(imgUrl(o.img))}" alt="${esc(o.texto)}" data-zoom="${esc(o.id)}">` : ''}<figcaption><span>${esc(o.mia ? 'Tu foto' : o.texto)}</span>${o.mia ? '' : `<button type="button" class="like" data-op="${esc(o.id)}" aria-label="Me gusta" aria-pressed="${s.includes(o.id)}">${s.includes(o.id) ? '♥' : '♡'}</button>`}</figcaption></figure>`).join('')}</div>${v.tipo === 'concurso' && !ops.length ? '<p class="pend">Nadie ha enviado fotos.</p>' : ''}<p class="vm">${v.multiple ? `Toca el corazón de las que te gusten (hasta ${v.max_opciones}).` : 'Toca el corazón de la que más te guste.'}</p>` + BOTON(propio, editando);
  if (v.tipo === 'numerica'){ const a = [], cur = s[0]; for (let n = v.escala_min; n <= v.escala_max; n++) a.push(n);
    return `<div class="nums">${a.map(n => `<button type="button" class="num ${String(n) === cur ? 'sel' : ''}" data-num="${n}">${n}</button>`).join('')}</div><p class="vm">Elige un valor del ${v.escala_min} al ${v.escala_max}.</p>` + BOTON(propio, editando); }
  return `<div class="ops">${ops.map(o => `<button type="button" class="op ${s.includes(o.id) ? 'sel' : ''}" data-op="${esc(o.id)}">${o.img ? `<img class="th" src="${esc(imgUrl(o.img))}" alt="">` : ''}${esc(o.texto)}</button>`).join('')}</div>` + BOTON(propio, editando);
}
function resultadosHtml(v, R, ops, propio){
  const tot = Math.max(1, R.votantes), C = R.conteos || {};

  $('fK').onclick = $('fK2').onclick = () => $('edDlg').close();
  $('fS').onclick = async () => {
    const f = { titulo: $('fT').value.trim(), descripcion: $('fD').value.trim() || null, inicio: new Date($('fI').value).toISOString(), fin: new Date($('fF').value).toISOString(), multiple: $('fM').checked, max_opciones: $('fM').checked ? Math.max(1, +$('fX').value || 1) : 1, permitir_cambio: $('fC').checked, en_blanco: $('fB').checked, resultados: E.res, tipo: E.tipo };
    if (!f.titulo) return toast('Pon un título.'); if (!(new Date(f.fin) > new Date(f.inicio))) return toast('El final debe ser posterior al inicio.');
    if (E.tipo === 'numerica'){ f.escala_min = Math.max(0, parseInt($('fMin').value, 10)); f.escala_max = Math.min(100, parseInt($('fMax').value, 10)); if (!(f.escala_max > f.escala_min)) return toast('El máximo debe ser mayor que el mínimo.'); f.multiple = false; f.max_opciones = 1; f.en_blanco = false; }
    else if (E.tipo === 'concurso'){ f.envios_desde = new Date($('fEd').value).toISOString(); f.envios_hasta = new Date($('fEh').value).toISOString(); f.fotos_por_miembro = Math.min(5, Math.max(1, parseInt($('fNf').value, 10) || 1)); f.en_blanco = false;
      if (!(new Date(f.envios_desde) < new Date(f.envios_hasta))) return toast('El envío debe terminar después de empezar.'); if (new Date(f.envios_hasta) > new Date(f.inicio)) return toast('La votación debe empezar cuando termine el envío o después.'); }
    else {
      if (E.tipo === 'galeria'){ if (E.ops.some(o => !o.file && !o.img)) return toast('Cada foto necesita su imagen.'); E.ops.forEach((o, i) => { if (!o.texto.trim()) o.texto = 'Foto ' + (i + 1); }); f.en_blanco = false; }
      else if (E.ops.some(o => !o.texto.trim())) return toast('Hay opciones sin texto.');
      if (E.ops.length < 2) return toast(E.tipo === 'galeria' ? 'Pon al menos 2 fotos.' : 'Pon al menos 2 opciones.');
      if (f.max_opciones > E.ops.length) f.max_opciones = E.ops.length; }
    $('fS').disabled = true;
    try {
      f.imagen_path = E.portadaFile ? await subir(await reducir(E.portadaFile, 1400)) : E.portada;
      if (E.tipo !== 'numerica' && E.tipo !== 'concurso') for (const o of E.ops) if (o.file) o.img = await subir(await reducir(o.file, 600));
    } catch (e) { $('fS').disabled = false; return toast('No se pudo subir una imagen.'); }
    if (E.tipo !== 'concurso'){ f.envios_desde = null; f.envios_hasta = null; f.fotos_por_miembro = 1; }
    if (n) E.ops.forEach((o, i) => { o.id = 'o' + (i + 1); });
    f.opciones = (E.tipo === 'numerica' || E.tipo === 'concurso') ? [] : E.ops.map(o => { const x = { id: o.id, texto: o.texto.trim() }; if (o.img) x.img = o.img; return x; });
    const r = n ? await sb.from('votaciones').insert(f) : await sb.from('votaciones').update(f).eq('id', v.id);
    $('fS').disabled = false; if (r.error) return toast('No se pudo guardar: ' + r.error.message);
    if (!n){ const nuevas = new Set([f.imagen_path, ...f.opciones.map(o => o.img)]); await quitarArchivos([orig.imagen_path, ...(orig.opciones || []).map(o => o.img)].filter(p => p && !nuevas.has(p))); } $('edDlg').close(); toast('Votación guardada.'); load(); };
  $('edDlg').showModal();
}
$('zoomDlg').onclick = () => $('zoomDlg').close();
$('nueva').onclick = () => editar(null);
$('adminToggleBtn').addEventListener('click', () => {
  if (isAdmin) sb.auth.signOut();
  else { $('loginError').textContent = ''; $('loginEmail').value = ''; $('loginPass').value = ''; $('loginDialog').showModal(); }
});
$('loginCancel').addEventListener('click', () => $('loginDialog').close());
$('loginSubmit').addEventListener('click', async () => {
  const { error } = await sb.auth.signInWithPassword({ email: $('loginEmail').value.trim(), password: $('loginPass').value });
  if (error) $('loginError').textContent = 'Email o contraseña incorrectos.'; else $('loginDialog').close();
});
sb.auth.onAuthStateChange((_e, session) => { isAdmin = !!session; $('adminToggleBtn').textContent = isAdmin ? 'Cerrar sesión admin' : 'Acceso admin'; load(); });
</script>
</body>
