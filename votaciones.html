<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Votaciones · Moonlight Team</title>
<meta name="description" content="Votaciones de Moonlight Team: vota con tu carnet y mira los resultados.">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,500;0,600;1,500;1,600&family=Crimson+Pro:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
<style>
  .wrap{ max-width:820px; }
  .top h1{ font-size:clamp(1.9rem,8vw,3rem); line-height:1.1; }
  .aviso{ margin:4px 0 16px; padding:10px 14px; border:1px solid rgba(125,255,176,.4); border-radius:10px; background:rgba(125,255,176,.07); font-size:.95rem; line-height:1.45; }
  .aviso b{ color:#9dffc6; }
  .vl{ display:grid; gap:14px; margin-bottom:30px; }
  .vc{ border:1px solid var(--border); border-radius:12px; background:rgba(16,22,48,.72); padding:16px 18px; }
  .vc h2{ margin:0 0 4px; font-family:'Cormorant',serif; font-style:italic; font-size:1.55rem; color:var(--gold); display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
  .chip{ font-family:'Crimson Pro',serif; font-style:normal; font-size:.82rem; padding:2px 10px; border-radius:999px; border:1px solid var(--border); color:var(--ink-soft); }
  .chip.on{ color:#7dffb0; border-color:rgba(125,255,176,.5); background:rgba(125,255,176,.08); }
  .chip.pr{ color:var(--gold); border-color:rgba(217,195,131,.5); }
  .vd{ color:var(--ink-soft); margin:4px 0; white-space:pre-wrap; }
  .vm{ color:var(--ink-soft); font-size:.88rem; margin:6px 0; }
  .ops{ display:grid; gap:8px; margin:12px 0; }
  .op{ text-align:left; padding:10px 14px; border-radius:8px; border:1px solid var(--border); background:rgba(255,255,255,.04); color:var(--ink); font-family:'Crimson Pro',serif; font-size:1.05rem; cursor:pointer; transition:all .15s; }
  .op:hover{ border-color:var(--gold-dim); }
  .op.sel{ border-color:var(--gold); background:rgba(217,195,131,.14); color:var(--gold); }
  .op.sel::before{ content:'✓ '; }
  .barra{ position:relative; padding:8px 12px; border:1px solid var(--border); border-radius:8px; overflow:hidden; display:flex; justify-content:space-between; gap:10px; }
  .barra i{ position:absolute; inset:0 auto 0 0; background:rgba(217,195,131,.2); z-index:0; }
  .barra span{ position:relative; z-index:1; }
  .barra.tuya{ border-color:var(--gold); }
  .fila{ display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; align-items:center; }
  .gbtn{ padding:6px 14px; border-radius:999px; font-family:'Cormorant',serif; font-style:italic; font-weight:600; font-size:1rem; cursor:pointer; color:var(--gold); border:1px solid rgba(217,195,131,.5); background:rgba(217,195,131,.08); }
  .gbtn:hover{ background:rgba(217,195,131,.22); } .gbtn[disabled]{ opacity:.5; cursor:default; }
  .gbtn.suave{ color:var(--ink-soft); border-color:var(--border); background:none; font-size:.92rem; }
  .pend{ color:var(--ink-soft); font-style:italic; margin:8px 0; }
  .quien{ display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
  .quien span{ font-size:.9rem; padding:3px 10px; border-radius:999px; border:1px solid var(--border); color:var(--ink-soft); }
  .quien span.si{ color:#7dffb0; border-color:rgba(125,255,176,.45); }
  dialog.adv{ width:min(720px, calc(100vw - 20px)); max-width:none; max-height:calc(100dvh - 20px); padding:0; border:1px solid var(--gold-dim); border-radius:14px; background:#101630; color:var(--ink); overflow:hidden; }
  dialog.adv[open]{ display:flex; flex-direction:column; }
  dialog.adv::backdrop{ background:rgba(4,6,18,.72); backdrop-filter:blur(3px); }
  .ed{ display:flex; flex-direction:column; min-height:0; flex:1; overflow:hidden; }
  .ed-h{ display:flex; align-items:center; justify-content:space-between; padding:16px 20px 12px; border-bottom:1px solid var(--border); }
  .ed-h h3{ margin:0; font-family:'Cormorant',serif; font-style:italic; font-size:1.6rem; color:var(--gold); }
  .ed-x{ background:none; border:none; color:var(--ink-soft); font-size:1.7rem; line-height:1; cursor:pointer; }
  .ed-body{ overflow-x:hidden; overflow-y:auto; padding:6px 20px 14px; flex:1; }
  .ed-f{ display:flex; gap:10px; padding:12px 20px; border-top:1px solid var(--border); background:#0d1228; }
  .sec{ margin:12px 0 4px; font-family:'Cormorant',serif; font-style:italic; font-weight:600; font-size:1.15rem; color:var(--ink); border-bottom:1px solid var(--border); padding-bottom:4px; }
  .cp{ display:flex; flex-direction:column; gap:4px; margin:8px 0; color:var(--ink-soft); font-size:.9rem; }
  .cp > span small{ opacity:.7; }
  .ed input[type=text], .ed input[type=datetime-local], .ed input[type=number], .ed select, .ed textarea{ width:100%; box-sizing:border-box; padding:9px 11px; font-family:inherit; font-size:1rem; color:var(--ink); background:#141b37; border:1px solid var(--border); border-radius:8px; color-scheme:dark; }
  .ed input:focus, .ed textarea:focus, .ed select:focus{ outline:none; border-color:var(--gold); box-shadow:0 0 0 3px rgba(217,195,131,.15); }
  .ed textarea{ min-height:56px; resize:vertical; }
  .g2 > *{ min-width:0; }
  .g2{ display:grid; grid-template-columns:1fr 1fr; gap:10px; } @media (max-width:460px){ .g2{ grid-template-columns:1fr; } }
  .portada{ position:relative; border:1.5px dashed var(--border); border-radius:10px; min-height:60px; display:flex; align-items:center; justify-content:center; overflow:hidden; cursor:pointer; color:var(--ink-soft); background:rgba(255,255,255,.03); text-align:center; font-size:.95rem; }
  .portada:hover{ border-color:var(--gold-dim); }
  .portada img{ display:block; width:100%; max-height:190px; object-fit:cover; }
  .portada .q{ position:absolute; top:6px; right:6px; background:rgba(8,12,30,.8); border:1px solid var(--border); color:var(--ink); border-radius:999px; font-size:.8rem; padding:2px 10px; cursor:pointer; }
  .orow{ display:flex; gap:8px; align-items:center; margin:6px 0; }
  .orow input[type=text]{ flex:1; }
  .oimg{ flex:none; width:42px; height:42px; border-radius:8px; border:1px dashed var(--border); background:rgba(255,255,255,.03) center/cover no-repeat; color:var(--ink-soft); cursor:pointer; font-size:1.1rem; display:flex; align-items:center; justify-content:center; padding:0; }
  .oimg:hover{ border-color:var(--gold-dim); }
  .odel{ flex:none; width:32px; height:32px; border-radius:50%; border:1px solid var(--border); background:none; color:var(--ink-soft); cursor:pointer; }
  .odel:hover{ color:#ff8a8a; border-color:#ff8a8a; }
  .sw{ display:flex; align-items:center; justify-content:space-between; gap:14px; padding:10px 12px; margin:6px 0; border:1px solid var(--border); border-radius:10px; background:rgba(255,255,255,.03); cursor:pointer; }
  .sw b{ display:block; font-weight:600; color:var(--ink); font-size:1rem; } .sw small{ color:var(--ink-soft); font-size:.84rem; }
  .sw input{ position:absolute; opacity:0; pointer-events:none; }
  .sw i{ flex:none; width:44px; height:25px; border-radius:999px; background:#2a3256; position:relative; transition:background .2s; }
  .sw i::after{ content:''; position:absolute; top:3px; left:3px; width:19px; height:19px; border-radius:50%; background:#cfd6f5; transition:transform .2s; }
  .sw input:checked + i{ background:var(--gold); } .sw input:checked + i::after{ transform:translateX(19px); background:#241c0c; }
  .sw input:focus-visible + i{ box-shadow:0 0 0 3px rgba(217,195,131,.35); }
  .seg{ display:grid; grid-template-columns:repeat(3,1fr); gap:6px; }
  .seg button{ padding:9px 6px; border-radius:8px; border:1px solid var(--border); background:rgba(255,255,255,.04); color:var(--ink-soft); font-family:inherit; font-size:.92rem; cursor:pointer; line-height:1.2; }
  .seg button.on{ border-color:var(--gold); color:var(--gold); background:rgba(217,195,131,.12); }
  .nota{ font-size:.84rem; color:var(--ink-soft); margin:4px 0; }
  .portada-v{ display:block; width:calc(100% + 36px); margin:-16px -18px 12px; max-height:190px; object-fit:cover; border-radius:12px 12px 0 0; }
  .op .th{ width:38px; height:38px; border-radius:6px; object-fit:cover; vertical-align:middle; margin-right:10px; }
  #toast{ position:fixed; left:50%; bottom:20px; transform:translate(-50%,20px); background:#141b37; border:1px solid var(--gold-dim); color:var(--ink); padding:9px 16px; border-radius:8px; opacity:0; transition:all .3s; z-index:30; pointer-events:none; max-width:90vw; text-align:center; }
  #toast.show{ opacity:1; transform:translate(-50%,0); }
</style>
</head><body>
<div class="stars" id="starsLayer" aria-hidden="true"></div>
<div class="mist m1" aria-hidden="true"></div>
<div class="mist m2" aria-hidden="true"></div>
<div class="moon" aria-hidden="true"></div>
<div class="wrap">
  <a class="back-link" href="index.html">← Volver al índice</a>
  <header class="top">
    <div>
      <div class="title-wrap"><h1>Votaciones</h1></div>
      <p class="subtitle">Decide con el resto del team. Para votar necesitas tu carnet.</p>
    </div>
    <button class="admin-toggle" id="adminToggleBtn">Acceso admin</button>
  </header>
  <div class="aviso"><b>🗳️ Nadie verá qué has votado.</b> Solo se publican los totales. Los admins únicamente ven quién ha votado y quién falta, nunca qué ha elegido cada uno.</div>
  <div class="fila" id="adminBar" hidden><button class="gbtn" id="nueva" type="button">+ Nueva votación</button></div>
  <p class="pend" id="yo"></p>
  <div class="vl" id="vl"></div>
</div>
<dialog class="adv" id="edDlg"><div class="ed" id="eB"></div></dialog>
<dialog id="loginDialog">
  <div class="dialog-inner">
    <h3>Acceso admin</h3>
    <div class="dialog-field"><label for="loginEmail">Email</label><input id="loginEmail" type="email" autocomplete="username"></div>
    <div class="dialog-field"><label for="loginPass">Contraseña</label><input id="loginPass" type="password" autocomplete="current-password"></div>
    <p class="dialog-error" id="loginError"></p>
    <div class="dialog-actions">
      <button class="btn-primary" id="loginSubmit" type="button">Entrar</button>
      <button class="btn-ghost" id="loginCancel" type="button">Cancelar</button>
    </div>
  </div>
</dialog>
<div id="toast" role="status"></div>
<script src="js/temporadas.js" defer></script>
<script type="module">
import { sb } from './js/supabase-sesion.js';
import { tokenActual, miMiembro } from './js/carnet.js';
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
(function(){ const l = $('starsLayer'), fr = document.createDocumentFragment(); for (let i = 0; i < 30; i++){ const s = document.createElement('span'); s.className = 'star'; const z = (Math.random()*1.6+.8).toFixed(2); s.style.cssText = `top:${Math.random()*100}%;left:${Math.random()*100}%;width:${z}px;height:${z}px`; s.style.setProperty('--dur', (Math.random()*3+2).toFixed(2)+'s'); s.style.setProperty('--delay', (Math.random()*5).toFixed(2)+'s'); s.style.setProperty('--o-min', '.2'); s.style.setProperty('--o-max', '.85'); fr.appendChild(s); } l.appendChild(fr); })();
const toast = t => { const e = $('toast'); e.textContent = t; e.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => e.classList.remove('show'), 3800); };
const fmt = d => new Date(d).toLocaleString('es-ES', { timeZone: 'Europe/Madrid', day: 'numeric', month: 'long', hour: '2-digit', minute: '2-digit' });
const aLocal = d => { const x = new Date(new Date(d).getTime() - new Date(d).getTimezoneOffset() * 60000); return x.toISOString().slice(0, 16); };
const MSG = { sin_carnet: 'Necesitas tu carnet para votar.', no_existe: 'Esa votación ya no existe.', no_empezada: 'Esta votación aún no ha empezado.', cerrada: 'Esta votación ya está cerrada.', opcion_invalida: 'Elige una opción válida.', demasiadas: 'Has elegido demasiadas opciones.', ya_votaste: 'Ya has votado y no se puede cambiar.' };
let isAdmin = false, yo = null, V = [], mi = {}, res = {}, nombres = {}, miembros = [], carn = new Set(), quien = {}, abierta = {}, sel = {};

async function load(){
  yo = await miMiembro();
  $('yo').textContent = yo ? '' : 'No hemos encontrado tu carnet en este navegador: puedes ver las votaciones, pero para votar abre tu enlace personal.';
  const { data } = await sb.from('votaciones').select('*').order('fin', { ascending: false }); V = data || [];
  const tk = tokenActual(); mi = {}; res = {};
  await Promise.all(V.map(async v => {
    if (yo){ const r = await sb.rpc('mi_voto', { p_votacion: v.id, p_token: tk }); mi[v.id] = r.data || null; }
    const r2 = await sb.rpc('votacion_resultados', { p_votacion: v.id }); res[v.id] = r2.data || null;
  }));
  if (isAdmin){
    const [m, o, c] = await Promise.all([sb.from('miembros').select('id,data'), sb.from('ocupados').select('id,data'), sb.from('carnets').select('miembro_id')]);
    const per = {}; (o.data || []).forEach(x => { const d = x.data || {}; if (d.miembroId) (per[d.miembroId] = per[d.miembroId] || []).push(d.nombre); });
    miembros = (m.data || []).filter(r => !(r.data && (r.data.baneado || r.data.activo === false)) && per[r.id]); nombres = {};
    miembros.forEach(r => nombres[r.id] = (per[r.id] || []).join(', ') || (r.data || {}).apodoInterno || r.id);
    carn = new Set((c.data || []).map(x => x.miembro_id));
  }
  paint();
}
const estado = v => { const n = Date.now(); return n < new Date(v.inicio) ? 'pronto' : n > new Date(v.fin) ? 'cerrada' : 'abierta'; };
const nom = (v, id) => id === 'blanco' ? 'En blanco' : ((v.opciones.find(o => o.id === id) || {}).texto || id);
function paint(){
  $('adminBar').hidden = !isAdmin;
  const orden = { abierta: 0, pronto: 1, cerrada: 2 };
  const L = V.slice().sort((a, b) => orden[estado(a)] - orden[estado(b)] || new Date(b.fin) - new Date(a.fin));
  $('vl').innerHTML = L.map(v => { const e = estado(v), R = res[v.id], propio = mi[v.id], ops = v.opciones.concat(v.en_blanco ? [{ id: 'blanco', texto: 'En blanco' }] : []);
    const s = sel[v.id] || (propio ? propio.slice() : []), editando = abierta[v.id] === 'edit';
    let cuerpo = '';
    if (e === 'abierta'){
      if (!yo) cuerpo = '<p class="pend">Abre tu enlace personal (carnet) para poder votar.</p>';
      else if (propio && !editando) cuerpo = `<p class="pend">✅ Has votado: <b>${esc(propio.map(x => nom(v, x)).join(', '))}</b>.${v.permitir_cambio ? '' : ' No se puede cambiar.'}</p>` + (v.permitir_cambio ? '<div class="fila"><button class="gbtn suave" data-ed="1" type="button">Cambiar mi voto</button></div>' : '');
      else cuerpo = `<div class="ops">${ops.map(o => `<button type="button" class="op ${s.includes(o.id) ? 'sel' : ''}" data-op="${esc(o.id)}">${o.img ? `<img class="th" src="${esc(imgUrl(o.img))}" alt="">` : ''}${esc(o.texto)}</button>`).join('')}</div><div class="fila"><button class="gbtn" data-votar="1" type="button">${propio ? 'Guardar cambio' : 'Votar'}</button>${editando ? '<button class="gbtn suave" data-cancel="1" type="button">Cancelar</button>' : ''}</div>`;
    } else if (e === 'pronto') cuerpo = `<p class="pend">Se abre el ${esc(fmt(v.inicio))}.</p>`;
    else if (propio) cuerpo = `<p class="pend">Tu voto: ${esc(propio.map(x => nom(v, x)).join(', '))}.</p>`;
    let r = '';
    if (R){ const tot = Math.max(1, R.votantes); r = `<div class="ops">${ops.map(o => { const n = (R.conteos || {})[o.id] || 0; return `<div class="barra ${propio && propio.includes(o.id) ? 'tuya' : ''}"><i style="width:${Math.round(n * 100 / tot)}%"></i><span>${esc(o.texto)}</span><span>${n}</span></div>`; }).join('')}</div><p class="vm">${R.votantes} ${R.votantes === 1 ? 'persona ha votado' : 'personas han votado'}.</p>`; }
    else if (v.resultados === 'final') r = '<p class="vm">Los resultados se publicarán cuando termine la votación.</p>'; else if (v.resultados === 'nunca') r = '<p class="vm">Esta votación no publica resultados.</p>';
    let adm = '';
    if (isAdmin){ const q = quien[v.id]; adm = `<div class="fila"><button class="gbtn suave" data-quien="1" type="button">Quién ha votado</button><button class="gbtn suave" data-edit="1" type="button">Editar</button>${e === 'abierta' ? '<button class="gbtn suave" data-cerrar="1" type="button">Cerrar ya</button>' : ''}<button class="gbtn suave" data-borrar="1" type="button">Borrar</button></div>`
      + (q ? `<p class="vm">${q.filter(x => x.v).length} de ${q.length} han votado (solo se ve quién, nunca qué).</p><div class="quien">${q.map(x => `<span class="${x.v ? 'si' : ''}">${x.v ? '✓' : '·'} ${esc(x.n)}${x.c ? '' : ' (sin carnet)'}</span>`).join('')}</div>` : ''); }
    const extra = [v.multiple ? `elige hasta ${v.max_opciones}` : 'una opción', v.permitir_cambio ? 'se puede cambiar' : 'no se puede cambiar'].join(' · ');
    return `<section class="vc" data-id="${v.id}">${v.imagen_path ? `<img class="portada-v" src="${esc(imgUrl(v.imagen_path))}" alt="">` : ''}<h2>${esc(v.titulo)} <span class="chip ${e === 'abierta' ? 'on' : e === 'pronto' ? 'pr' : ''}">${e === 'abierta' ? 'Abierta' : e === 'pronto' ? 'Próximamente' : 'Cerrada'}</span></h2>${v.descripcion ? `<p class="vd">${esc(v.descripcion)}</p>` : ''}<p class="vm">${esc(fmt(v.inicio))} → ${esc(fmt(v.fin))} · ${esc(extra)}</p>${cuerpo}${r}${adm}</section>`; }).join('') || '<p class="pend">No hay votaciones por ahora.</p>';
}
$('vl').addEventListener('click', async e => {
  const sec = e.target.closest('.vc'); if (!sec) return; const id = sec.dataset.id, v = V.find(x => x.id === id);
  const op = e.target.closest('[data-op]');
  if (op){ const o = op.dataset.op; let s = (sel[id] || (mi[id] ? mi[id].slice() : [])).slice();
    if (!v.multiple || o === 'blanco') s = s.includes(o) ? [] : [o];
    else { s = s.filter(x => x !== 'blanco'); if (s.includes(o)) s = s.filter(x => x !== o); else if (s.length < v.max_opciones) s.push(o); else toast(`Máximo ${v.max_opciones} opciones.`); }
    sel[id] = s; paint(); return; }
  if (e.target.closest('[data-ed]')){ abierta[id] = 'edit'; sel[id] = (mi[id] || []).slice(); paint(); }
  if (e.target.closest('[data-cancel]')){ delete abierta[id]; delete sel[id]; paint(); }
  if (e.target.closest('[data-votar]')){ const s = sel[id] || []; if (!s.length) return toast('Elige al menos una opción.');
    const { data, error } = await sb.rpc('votar', { p_votacion: id, p_token: tokenActual(), p_opciones: s });
    if (error) return toast('No se pudo votar. Inténtalo de nuevo.'); if (data !== 'ok') return toast(MSG[data] || 'No se pudo votar.');
    delete abierta[id]; delete sel[id]; toast('¡Voto guardado!'); load(); }
  if (e.target.closest('[data-quien]')){ const { data } = await sb.rpc('votacion_quienes', { p_votacion: id }); const set = new Set(data || []);
    quien[id] = miembros.map(m => ({ id: m.id, n: nombres[m.id], v: set.has(m.id), c: carn.has(m.id) })).sort((a, b) => b.v - a.v || a.n.localeCompare(b.n)); paint(); }
  if (e.target.closest('[data-edit]')) editar(v);
  if (e.target.closest('[data-cerrar]')){ if (!confirm('¿Cerrar la votación ahora?')) return; const { error } = await sb.from('votaciones').update({ fin: new Date().toISOString() }).eq('id', id); if (error) return toast('No se pudo cerrar.'); load(); }
  if (e.target.closest('[data-borrar]')){ if (!confirm('¿Borrar la votación y todos sus votos?')) return; const { error } = await sb.from('votaciones').delete().eq('id', id); if (error) return toast('No se pudo borrar.'); load(); }
});
const imgUrl = p => p ? sb.storage.from('mooncards').getPublicUrl(p).data.publicUrl : '';
function reducir(file, max){ return new Promise((ok, ko) => { const im = new Image(), u = URL.createObjectURL(file); im.onload = () => { const k = Math.min(1, max / Math.max(im.width, im.height)), c = document.createElement('canvas'); c.width = Math.round(im.width * k); c.height = Math.round(im.height * k); c.getContext('2d').drawImage(im, 0, 0, c.width, c.height); URL.revokeObjectURL(u); c.toBlob(b => b ? ok(b) : ko(), 'image/jpeg', .86); }; im.onerror = ko; im.src = u; }); }
async function subir(blob){ const p = `vot/${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 7)}.jpg`; const r = await sb.storage.from('mooncards').upload(p, blob, { contentType: 'image/jpeg' }); if (r.error) throw r.error; return p; }
function elegirImagen(cb){ const i = document.createElement('input'); i.type = 'file'; i.accept = 'image/png,image/jpeg,image/webp'; i.onchange = () => { const f = i.files[0]; if (f) cb(f); }; i.click(); }
function editar(v){
  const n = !v; v = v || { titulo: '', descripcion: '', opciones: [{ id: 'o1', texto: '' }, { id: 'o2', texto: '' }], inicio: new Date().toISOString(), fin: new Date(Date.now() + 7 * 864e5).toISOString(), multiple: false, max_opciones: 2, permitir_cambio: true, resultados: 'final', en_blanco: false, imagen_path: null };
  const E = { portada: v.imagen_path, portadaFile: null, ops: v.opciones.map(o => ({ id: o.id, texto: o.texto, img: o.img || null, file: null })), res: v.resultados };
  const sw = (id, t, d, on) => `<label class="sw"><span><b>${t}</b><small>${d}</small></span><input id="${id}" type="checkbox" ${on ? 'checked' : ''}><i></i></label>`;
  $('eB').innerHTML = `<div class="ed-h"><h3>${n ? 'Nueva votación' : 'Editar votación'}</h3><button class="ed-x" id="fK" type="button" aria-label="Cerrar">×</button></div>
  <div class="ed-body">
    <div class="sec">Qué se vota</div>
    <label class="cp"><span>Título</span><input id="fT" type="text" maxlength="120" value="${esc(v.titulo)}" placeholder="Ej. ¿Qué evento hacemos en diciembre?"></label>
    <label class="cp"><span>Descripción <small>(opcional)</small></span><textarea id="fD" maxlength="800" placeholder="Explica de qué va la votación">${esc(v.descripcion)}</textarea></label>
    <div class="cp"><span>Imagen de portada <small>(opcional)</small></span><div class="portada" id="fP"></div></div>
    <div class="sec">Opciones</div>
    <div id="fOps"></div>
    ${n ? '<button class="gbtn suave" id="fAdd" type="button">+ Añadir opción</button>' : '<p class="nota">Puedes cambiar el texto y la imagen, pero no añadir ni quitar opciones (ya puede haber votos).</p>'}
    <div class="sec">Cuándo</div>
    <div class="g2"><label class="cp"><span>Empieza</span><input id="fI" type="datetime-local" value="${aLocal(v.inicio)}"></label><label class="cp"><span>Termina</span><input id="fF" type="datetime-local" value="${aLocal(v.fin)}"></label></div>
    <div class="sec">Reglas</div>
    ${sw('fM', 'Voto múltiple', 'Se pueden elegir varias opciones', v.multiple)}
    <label class="cp" id="fXw" ${v.multiple ? '' : 'hidden'}><span>Máximo de opciones por persona</span><input id="fX" type="number" min="1" max="20" value="${v.max_opciones}"></label>
    ${sw('fC', 'Se puede cambiar el voto', 'Mientras la votación esté abierta', v.permitir_cambio)}
    ${sw('fB', 'Opción «En blanco»', 'Para quien no quiera elegir ninguna', v.en_blanco)}
    <div class="sec">Resultados</div>
    <div class="seg" id="fR">${[['final', 'Al terminar'], ['directo', 'En directo'], ['nunca', 'No se publican']].map(([k, t]) => `<button type="button" data-r="${k}" class="${E.res === k ? 'on' : ''}">${t}</button>`).join('')}</div>
    <p class="nota">Tú, como admin, siempre ves los totales.</p>
  </div>
  <div class="ed-f"><button class="gbtn" id="fS" type="button">Guardar</button><button class="gbtn suave" id="fK2" type="button">Cancelar</button></div>`;
  const pintaP = () => { const u = E.portadaFile ? URL.createObjectURL(E.portadaFile) : imgUrl(E.portada); $('fP').innerHTML = u ? `<img src="${esc(u)}" alt=""><button class="q" type="button">Quitar</button>` : '🖼️ Toca para añadir una imagen'; $('fP').querySelector('.q') && ($('fP').querySelector('.q').onclick = e => { e.stopPropagation(); E.portada = null; E.portadaFile = null; pintaP(); }); };
  $('fP').onclick = () => elegirImagen(f => { E.portadaFile = f; pintaP(); }); pintaP();
  const pintaO = () => { $('fOps').innerHTML = E.ops.map((o, i) => `<div class="orow" data-i="${i}"><button class="oimg" type="button" title="Imagen de la opción" style="${o.file ? `background-image:url('${URL.createObjectURL(o.file)}')` : o.img ? `background-image:url('${imgUrl(o.img)}')` : ''}">${o.file || o.img ? '' : '🖼️'}</button><input type="text" maxlength="80" value="${esc(o.texto)}" placeholder="Opción ${i + 1}">${n && E.ops.length > 2 ? '<button class="odel" type="button" title="Quitar">×</button>' : ''}</div>`).join(''); };
  pintaO();
  $('fOps').addEventListener('input', e => { const r = e.target.closest('.orow'); if (r) E.ops[+r.dataset.i].texto = e.target.value; });
  $('fOps').addEventListener('click', e => { const r = e.target.closest('.orow'); if (!r) return; const i = +r.dataset.i;
    if (e.target.closest('.odel')){ E.ops.splice(i, 1); pintaO(); }
    else if (e.target.closest('.oimg')) elegirImagen(f => { E.ops[i].file = f; pintaO(); }); });
  if (n) $('fAdd').onclick = () => { if (E.ops.length >= 20) return toast('Máximo 20 opciones.'); E.ops.push({ id: 'o' + (E.ops.length + 1), texto: '', img: null, file: null }); pintaO(); $('fOps').lastChild.querySelector('input').focus(); };
  $('fM').onchange = () => { $('fXw').hidden = !$('fM').checked; };
  $('fR').onclick = e => { const b = e.target.closest('[data-r]'); if (!b) return; E.res = b.dataset.r; $('fR').querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); };
  $('fK').onclick = $('fK2').onclick = () => $('edDlg').close();
  $('fS').onclick = async () => {
    const f = { titulo: $('fT').value.trim(), descripcion: $('fD').value.trim() || null, inicio: new Date($('fI').value).toISOString(), fin: new Date($('fF').value).toISOString(), multiple: $('fM').checked, max_opciones: $('fM').checked ? Math.max(1, +$('fX').value || 1) : 1, permitir_cambio: $('fC').checked, en_blanco: $('fB').checked, resultados: E.res };
    if (!f.titulo) return toast('Pon un título.'); if (!(new Date(f.fin) > new Date(f.inicio))) return toast('El final debe ser posterior al inicio.');
    if (E.ops.some(o => !o.texto.trim())) return toast('Hay opciones sin texto.'); if (E.ops.length < 2) return toast('Pon al menos 2 opciones.');
    if (f.max_opciones > E.ops.length) f.max_opciones = E.ops.length;
    $('fS').disabled = true;
    try {
      f.imagen_path = E.portadaFile ? await subir(await reducir(E.portadaFile, 1400)) : E.portada;
      for (const o of E.ops) if (o.file) o.img = await subir(await reducir(o.file, 600));
    } catch (e) { $('fS').disabled = false; return toast('No se pudo subir una imagen.'); }
    f.opciones = E.ops.map(o => { const x = { id: o.id, texto: o.texto.trim() }; if (o.img) x.img = o.img; return x; });
    const r = n ? await sb.from('votaciones').insert(f) : await sb.from('votaciones').update(f).eq('id', v.id);
    $('fS').disabled = false; if (r.error) return toast('No se pudo guardar: ' + r.error.message); $('edDlg').close(); toast('Votación guardada.'); load(); };
  $('edDlg').showModal();
}
$('nueva').onclick = () => editar(null);
$('adminToggleBtn').addEventListener('click', () => {
  if (isAdmin) sb.auth.signOut();
  else { $('loginError').textContent = ''; $('loginEmail').value = ''; $('loginPass').value = ''; $('loginDialog').showModal(); }
});
$('loginCancel').addEventListener('click', () => $('loginDialog').close());
$('loginSubmit').addEventListener('click', async () => {
  const { error } = await sb.auth.signInWithPassword({ email: $('loginEmail').value.trim(), password: $('loginPass').value });
  if (error) $('loginError').textContent = 'Email o contraseña incorrectos.'; else $('loginDialog').close();
});
sb.auth.onAuthStateChange((_e, session) => { isAdmin = !!session; $('adminToggleBtn').textContent = isAdmin ? 'Cerrar sesión admin' : 'Acceso admin'; load(); });
</script>
</body>
</html>
