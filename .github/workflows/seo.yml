name: SEO (sitemap y noindex)

on:
  push:
    branches: [main, master]
  schedule:
    - cron: '17 5 * * *'   # cada día, por si cambias la visibilidad de una página desde el índice
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: seo
  cancel-in-progress: false

jobs:
  seo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Actualizar sitemap.xml y noindex
        run: python3 .github/scripts/seo.py

      - name: Guardar cambios
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Actualizar sitemap y noindex automáticamente"
            git push
            # si publicas con Actions (pages.yml), este commit no lo lanza solo: se lanza aquí
            gh workflow run pages.yml || true
          fi
